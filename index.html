}
/* ---------- assistant ---------- */
const DAY_WORDS = [
  [0, /\b(mon|monday|somvar|सोमवार)/i], [1, /\b(tue|tuesday|mangalvar|mangal|मंगलवार)/i], [2, /\b(wed|wednesday|budhvar|budh|बुधवार)/i],
  [3, /\b(thu|thursday|guruvar|brihaspati|गुरुवार)/i], [4, /\b(fri|friday|shukravar|shukra|शुक्रवार)/i], [5, /\b(sat|saturday|shanivar|shani|शनिवार)/i],
];
function parseDay(q) {
  for (const [d, re] of DAY_WORDS) if (re.test(q)) { let dt = todayISO(); for (let i = 0; i < 7 && dayIdx(dt) !== d; i++) dt = addDays(dt, 1); return { d, date: dt }; }
  if (/tomorrow|kal|कल/i.test(q)) { const dt = addDays(todayISO(), 1); return { d: dayIdx(dt), date: dt }; }
  return { d: dayIdx(todayISO()), date: todayISO() };
}
function localAnswer(q) {
  const hi = S.lang === 'hi';
  const { d, date } = parseDay(q);
  const pm = q.match(/(?:period|p|पीरियड|घंटी)\s*-?\s*(\d)/i) || q.match(/\b([1-8])(?:st|nd|rd|th)?\s*(?:period|पीरियड)/i);
  const nameHit = S.staff.find(s => q.toLowerCase().includes(s.name.toLowerCase()) || q.toLowerCase().includes(s.name.split(' ')[0].toLowerCase()));
  if (/free|khali|खाली|फ्री/i.test(q)) {
    if (d < 0) return hi ? 'उस दिन रविवार है, स्कूल बंद।' : 'That day is a Sunday — no school.';
    const periods = pm ? [Number(pm[1])] : PERIODS.map(p => p.n);
    return periods.map(p => `P${p} (${periodTime(p)}), ${dayName(d)}: ${freeTeachers(d, p, date).join(', ') || (hi ? 'कोई नहीं' : 'nobody')}`).join('\n');
  }
  if (/most|sabse|zyada|ज़्यादा|ज्यादा|fair/i.test(q)) {
    const ym = todayISO().slice(0, 7);
    const list = teachers().map(tc => [tc.name, monthSubs(tc.id, ym)]).sort((a, b) => b[1] - a[1]).slice(0, 5);
    return (hi ? 'इस महीने सबसे ज़्यादा प्रकाशित अरेंजमेंट:\n' : 'Most published substitutions this month:\n') + list.map(([n, c], i) => `${i + 1}. ${n} — ${c}`).join('\n');
  }
  if (/absent|leave|chutti|छुट्टी|अनुपस्थित|nahi aaye|नहीं आए/i.test(q) && !/pending|lambit|लंबित/i.test(q)) {
    const abs = absencesOn(date);
    return abs.length ? `${fmtDate(date)}:\n` + abs.map(a => `• ${nameOf(a.teacherId)} — ${absenceLabel(a)}`).join('\n') : (hi ? `${fmtDate(date)} को कोई अनुपस्थित नहीं।` : `Nobody is absent on ${fmtDate(date)}.`);
  }
  if (/pending|lambit|लंबित|waiting/i.test(q)) {
    const lv = S.leaves.filter(l => l.status === 'pending').length; const rq = S.requests.filter(r => r.status === 'requested').length;
    return hi ? `लंबित: ${lv} छुट्टी आवेदन, ${rq} नए DPP/वर्कशीट अनुरोध।` : `Waiting: ${lv} leave request(s) and ${rq} new DPP/worksheet request(s).`;
  }
  if (nameHit && nameHit.role === 'teacher') {
    if (d < 0) return hi ? 'उस दिन रविवार है।' : 'That day is a Sunday.';
    const plan = S.plans[date];
    return `${nameHit.name} — ${dayName(d)}:\n` + PERIODS.map(p => {
      const l = teacherLessonAt(nameHit.id, d, p.n);
      const s = plan && Object.values(plan.items).find(i => i.teacherId === nameHit.id && i.p === p.n);
      return `P${p.n}: ${isAbsent(nameHit.id, date, p.n) ? (hi ? 'छुट्टी' : 'on leave') : s ? `${hi ? 'अरेंजमेंट' : 'substitution'} ${s.cls} ${subjName(s.subject)}` : l ? `${l.cls} ${subjName(l.s)}` : t('free')}`;
    }).join('\n');
  }
  return hi ? 'मैं ये बता सकता हूँ: किसी पीरियड में कौन खाली है, आज कौन अनुपस्थित है, सबसे ज़्यादा अरेंजमेंट किसके, किसी शिक्षक का शेड्यूल, और लंबित काम।'
    : 'I can tell you: who is free in a period, who is absent, who has done the most substitutions, any teacher\'s schedule, and what is pending.';
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  // the dark backdrop closes the dialog only when the backdrop itself is clicked
  if (el.dataset.act === 'closeModalBack' && ev.target !== el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-change]');
  if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, ev);
});
document.addEventListener('submit', ev => {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  const fn = FORMS[form.dataset.form];
  if (fn) fn(new FormData(form), form);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

/* ===== AI assistant: Claude (through the school's server function) + school-data tools ===== */
const AI = { status: 'unknown', convo: [], busy: false, step: '', used: null, limit: null };

/* ---------- talking to the server function ---------- */
async function callAI(payload) {
  const { data, error } = await SB.functions.invoke('ai-assistant', { body: payload });
  if (!error) { AI.status = 'on'; AI.used = data.used; AI.limit = data.limit; return data; }
  let info = {};
  try { info = await error.context.json(); } catch (e) { }
  if (info.error === 'not_configured') AI.status = 'off';
  else if (info.error === 'limit') AI.status = 'limit';
  const err = new Error(info.error || 'network'); err.info = info; throw err;
}

/* ---------- helpers for tool inputs ---------- */
function resolveDate(s) {
  if (!s) return todayISO();
  const v = String(s).trim().toLowerCase();
  if (/^(today|aaj|आज)$/.test(v)) return todayISO();
  if (/^(tomorrow|kal|कल)$/.test(v)) return addDays(todayISO(), 1);
  if (/^yesterday$/.test(v)) return addDays(todayISO(), -1);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  let m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
  if (m) { const y = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : todayISO().slice(0, 4); return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  const d = dayFromName(v);
  if (d >= 0) { let dt = todayISO(); for (let i = 0; i < 7 && dayIdx(dt) !== d; i++) dt = addDays(dt, 1); return dt; }
  return todayISO();
}
function dayFromName(v) {
  if (v === undefined || v === null || v === '') return -1;
  if (typeof v === 'number') return v >= 0 && v < 6 ? v : -1;
  const s = String(v).toLowerCase();
  const i = DAYS.findIndex(x => s.startsWith(x.toLowerCase()));
  if (i >= 0) return i;
  const hi = DAYS_HI.findIndex(x => s.startsWith(x.slice(0, 3)));
  return hi;
}
const findPerson = q => {
  if (!q) return null;
  const s = String(q).toLowerCase().trim();
  return S.staff.find(x => x.id.toLowerCase() === s) || S.staff.find(x => x.name.toLowerCase() === s) ||
    S.staff.find(x => x.name.toLowerCase().includes(s)) || S.staff.find(x => s.split(/\s+/).every(w => x.name.toLowerCase().includes(w))) || null;
};
const subjCode = q => {
  if (!q) return null;
  const s = String(q).toLowerCase();
  return Object.keys(SUBJECTS).find(k => k.toLowerCase() === s || SUBJECTS[k].en.toLowerCase().startsWith(s) || SUBJECTS[k].hi === q) || null;
};
const clsCode = q => (q ? String(q).toUpperCase().replace(/\s|CLASS|-/g, '') : null);
const inRange = (d, from, to) => (!from || d >= from) && (!to || d <= to);
const lessonText = l => (l ? `${l.cls || ''} ${SUBJECTS[l.s].en}`.trim() : 'free');

  const u = me(), mgr = isManager(u), d = dayIdx(todayISO());
  return `You are the AI assistant in the staff app of ${SCHOOL.name}, ${SCHOOL.place}, India.
Today is ${todayISO()} (${d >= 0 ? DAYS_LONG[d] : 'Sunday, no school'}). School runs Monday–Saturday, 8 periods: ${PERIODS.map(p => `P${p.n} ${p.start}-${p.end}`).join(', ')}; lunch ${LUNCH.start}-${LUNCH.end}.
You are talking to ${u.name}, ${mgr ? `the school ${u.role} (full access to all school data)` : 'a teacher (they can see the timetable, their own leave, their own requests and published substitutions; never guess about other people\'s private matters)'}.

How to answer:
- Get every fact from the tools. Call as many tools as you need, in parallel when independent. Never invent names, numbers or dates.
- If something is not in the data, say so plainly.
- If a question is ambiguous, pick the most sensible reading, answer it, and mention the assumption in one short line.
- Reply in the user's language: Hindi (Devanagari) if they write Hindi, Hinglish if they write Hinglish, otherwise English.
- Be brief and direct. Lead with the answer. Use a small markdown table for lists of more than three rows, **bold** for key numbers. No headings.
- Dates as "Mon 16 Nov". Periods as P1–P8.
- You cannot change anything. If asked to change data, say which screen to use: Substitutions, Leave, Timetable, DPP & Worksheets, Staff, Notices or Settings${mgr ? '' : ' (only Admin/Coordinator can approve or edit)'}.
- You may also help with teaching work (question ideas, lesson outlines, explanations) when asked.`;
}

/* ---------- conversation loop ---------- */
const STEP_LABEL = { school_overview: ['Reading school overview', 'स्कूल जानकारी देख रहा है'], find_staff: ['Looking up staff', 'स्टाफ़ देख रहा है'], teacher_schedule: ['Checking a teacher\'s schedule', 'शिक्षक का शेड्यूल देख रहा है'],
  class_timetable: ['Checking class timetable', 'कक्षा समय-सारणी देख रहा है'], who_teaches: ['Checking who teaches what', 'कौन क्या पढ़ाता है देख रहा है'], free_teachers: ['Finding free teachers', 'खाली शिक्षक ढूँढ रहा है'],
  absences: ['Checking absences', 'अनुपस्थिति देख रहा है'], leave_requests: ['Checking leave', 'छुट्टी देख रहा है'], substitutions: ['Checking substitutions', 'अरेंजमेंट देख रहा है'],
  workload_and_fairness: ['Calculating workload', 'कार्यभार गिन रहा है'], dpp_worksheet_requests: ['Checking DPP & worksheets', 'DPP/वर्कशीट देख रहा है'], notices: ['Reading notices', 'सूचनाएँ पढ़ रहा है'],
  my_notifications: ['Reading notifications', 'सूचनाएँ पढ़ रहा है'], preview_substitution: ['Working out cover', 'अरेंजमेंट का अनुमान लगा रहा है'], audit_log: ['Reading change log', 'बदलाव रिकॉर्ड देख रहा है'] };

function trimConvo() {
  // keep the last ~20 messages, starting at a plain user question
  let c = AI.convo;
  if (c.length > 20) {
    c = c.slice(-20);
    while (c.length && !(c[0].role === 'user' && typeof c[0].content === 'string')) c.shift();
  }
  AI.convo = c;
}

async function askAssistant(q) {
  if (UI.chatBusy) return;
  UI.chat.push({ role: 'user', text: q });
  if (AI.status === 'off' || !SB) { UI.chat.push({ role: 'assistant', text: localAnswer(q), local: true }); render(); return; }
  UI.chatBusy = true; AI.step = L('Thinking…', 'सोच रहा है…'); render();
  AI.convo.push({ role: 'user', content: q });
  trimConvo();
  const tools = aiTools();
  const defs = tools.map(({ name, description, input_schema }) => ({ name, description, input_schema }));
  let answer = '';
  try {
    for (let round = 0; round < 8; round++) {
      const res = await callAI({ system: systemPrompt(), messages: AI.convo, tools: defs, max_tokens: 2500 });
      AI.convo.push({ role: 'assistant', content: res.content });
      const uses = (res.content || []).filter(b => b.type === 'tool_use');
      if (res.stop_reason !== 'tool_use' || !uses.length) {
        answer = (res.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
        break;
      }
      AI.step = uses.map(u => (STEP_LABEL[u.name] ? L(STEP_LABEL[u.name][0], STEP_LABEL[u.name][1]) : u.name)).join(' · ') + '…';
      const live = document.getElementById('liveAnswer'); if (live) live.textContent = AI.step;
      const results = uses.map(u => {
        const tool = tools.find(t => t.name === u.name);
        let out;
        try { out = tool ? tool.run(u.input || {}) : { error: 'unknown tool' }; } catch (e) { out = { error: String(e.message || e) }; }
        let text = JSON.stringify(out);
        if (text.length > 16000) text = text.slice(0, 16000) + ' …[cut: ask for a narrower range]';
        return { type: 'tool_result', tool_use_id: u.id, content: text };
      });
      AI.convo.push({ role: 'user', content: results });
    }
    if (!answer) answer = L('I could not finish that — please ask a narrower question.', 'यह पूरा नहीं हो सका — कृपया छोटा प्रश्न पूछें।');
    UI.chat.push({ role: 'assistant', text: answer });
  } catch (e) {
    // undo the unfinished turn so the conversation stays valid
    while (AI.convo.length && !(AI.convo[AI.convo.length - 1].role === 'user' && AI.convo[AI.convo.length - 1].content === q)) AI.convo.pop();
    AI.convo.pop();
    const why = AI.status === 'limit' ? L('You have reached today\'s AI limit. It resets at midnight.', 'आज की AI सीमा पूरी हो गई। आधी रात को फिर शुरू होगी।')
      : AI.status === 'off' ? L('AI is not set up yet (the Admin needs to add the Claude API key). Here is a built-in answer:', 'AI अभी सेट नहीं है (एडमिन को Claude API key जोड़नी है)। अंतर्निहित उत्तर:')
      : L('Could not reach the AI just now. Built-in answer:', 'अभी AI से जुड़ नहीं सका। अंतर्निहित उत्तर:');
    UI.chat.push({ role: 'assistant', text: why + (AI.status === 'limit' ? '' : '\n\n' + localAnswer(q)), local: true });
  }
  UI.chatBusy = false; AI.step = ''; render();
}
function newChat() { UI.chat = []; AI.convo = []; render(); }

/* ---------- DPP / worksheet drafts with Claude ---------- */
async function generateDraft(id) {
  const r = S.requests.find(x => x.id === id);
  const ta = document.getElementById('draftText'), btn = document.getElementById('genBtn');
  if (AI.status === 'off') { ta.value = templateDraft(r); toast(L('AI not set up — template added', 'AI सेट नहीं — टेम्पलेट जोड़ा')); return; }
  btn.disabled = true; btn.textContent = L('Claude is writing…', 'Claude लिख रहा है…');
  try {
    const res = await callAI({ system: 'You write printable school worksheets and practice sheets. Output only the sheet.', messages: [{ role: 'user', content: draftPrompt(r) }], max_tokens: 4000 });
    ta.value = (res.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    r.history.push({ at: nowStamp(), by: me().id, text: 'AI draft written — teacher to check' });
    toast(L('Draft ready — please check before printing', 'ड्राफ़्ट तैयार — प्रिंट से पहले जाँचें'));
  } catch (e) {
    ta.value = ta.value || templateDraft(r);
    toast(AI.status === 'limit' ? L('Daily AI limit reached — template added', 'दैनिक AI सीमा पूरी — टेम्पलेट जोड़ा') : AI.status === 'off' ? L('AI not set up — template added', 'AI सेट नहीं — टेम्पलेट जोड़ा') : L('AI could not write it — try again', 'AI नहीं लिख सका — फिर कोशिश करें'));
  } finally { btn.disabled = false; btn.textContent = '✨ ' + L('Write again', 'फिर से लिखें'); }
}

/* ---------- tiny, safe markdown for answers ---------- */
function md(src) {
  const lines = esc(src).split('\n');
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let html = '', i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i + 1])) {
      const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      html += '<div class="md-table"><table><thead><tr>' + cells(ln).map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { html += '<tr>' + cells(lines[i]).map(c => `<td>${c}</td>`).join('') + '</tr>'; i++; }
      html += '</tbody></table></div>'; continue;
    }
    if (/^\s*[-*•]\s+/.test(ln)) {
      html += '<ul>'; while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) { html += `<li>${inline(lines[i].replace(/^\s*[-*•]\s+/, ''))}</li>`; i++; } html += '</ul>'; continue;
    }
    if (/^\s*\d+[.)]\s+/.test(ln)) {
      html += '<ol>'; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { html += `<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/, ''))}</li>`; i++; } html += '</ol>'; continue;
    }
    if (/^#{1,4}\s+/.test(ln)) { html += `<p><b>${inline(ln.replace(/^#{1,4}\s+/, ''))}</b></p>`; i++; continue; }
    if (!ln.trim()) { i++; continue; }
    html += `<p>${inline(ln)}</p>`; i++;
  }
  return html;
}
