<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f3192">
<meta name="description" content="Staff app of Meridian The School, Gopalganj — timetable, leave, arrangements, DPP and worksheets.">
<title>MTS Staff App (test) — Meridian The School</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MTS Staff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
:root {
  --navy: #2f3192; --navy-2: #24257a; --navy-soft: #ecedfb; --red: #e01f27; --red-soft: #fdeceb;
  --ink: #1b1d2e; --ink-2: #4a4d63; --muted: #7a7d92; --line: #e3e4ee; --bg: #f5f6fb; --card: #fff;
  --ok: #128a4b; --ok-soft: #e5f6ec; --warn: #b26b00; --warn-soft: #fff4de; --violet: #6b4bd8; --violet-soft: #efeafd;
  --r: 12px; --shadow: 0 1px 2px rgba(20, 22, 60, .06), 0 4px 16px rgba(20, 22, 60, .06);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Inter', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 22px; } h3 { font-size: 16px; }
small { color: var(--muted); }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.bad { color: var(--red); font-weight: 600; }
.ok-text { color: var(--ok); font-weight: 600; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--card); padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; justify-content: center; white-space: nowrap; }
.btn:hover { border-color: #c9cbe0; }
.btn:disabled { opacity: .6; cursor: default; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.primary:hover { background: var(--navy-2); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger-ghost { color: var(--red); border-color: #f2c4c6; background: var(--card); }
.btn.ghost { background: transparent; }
.btn.ai { background: var(--violet-soft); border-color: #d9cff9; color: var(--violet); }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.tiny { padding: 4px 9px; font-size: 12px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn.center { margin: 14px auto 0; display: flex; }
.icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 20px; padding: 6px 8px; border-radius: 8px; position: relative; }
.icon-btn:hover { background: var(--navy-soft); }
.row-end { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; background: var(--card); border-bottom: 3px solid var(--red); padding: 8px 16px; }
.topbar .logo { width: 40px; height: 40px; object-fit: contain; }
.brand { display: flex; flex-direction: column; line-height: 1.15; }
.brand strong { color: var(--navy); font-size: 16px; }
.brand span { font-size: 12px; color: var(--muted); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.bell b { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; font-size: 10px; border-radius: 10px; padding: 1px 5px; }
.me { display: flex; align-items: center; gap: 8px; }
.me div { display: flex; flex-direction: column; line-height: 1.15; }
.me strong { font-size: 13px; } .me span { font-size: 11px; color: var(--muted); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--navy-soft); color: var(--navy); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex: none; }
.menu-btn { display: none; }

/* layout */
.layout { display: flex; min-height: calc(100vh - 59px); }
.sidebar { width: 232px; flex: none; background: var(--card); border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 59px; height: calc(100vh - 59px); overflow: auto; }
.nav { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; text-align: left; padding: 9px 12px; border-radius: 10px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.nav span { width: 22px; text-align: center; }
.nav:hover { background: var(--bg); }
.nav.active { background: var(--navy-soft); color: var(--navy); font-weight: 700; }
.nav.logout { margin-top: auto; }
.nav.lang-mobile { display: none; }
.demo-note { font-size: 11px; color: var(--muted); padding: 8px 12px; }
.content { flex: 1; padding: 22px 26px 60px; max-width: 1240px; min-width: 0; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

/* date bar */
.datebar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.datebar input[type=date] { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--card); }
.dayname { font-weight: 600; color: var(--navy); margin: 0 4px; }

/* cards and panels */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; border-left: 4px solid var(--navy); }
.stat span { font-size: 13px; color: var(--muted); }
.stat b { font-size: 28px; color: var(--navy); }
.stat.warn { border-left-color: var(--red); } .stat.warn b { color: var(--red); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.panel { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
.panel > h3 { margin-bottom: 12px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list li > div:first-child { display: flex; align-items: center; gap: 10px; min-width: 0; }
.list li > div > div { display: flex; flex-direction: column; min-width: 0; }
.list.compact li { padding: 7px 0; }
.banner { background: var(--navy-soft); color: var(--navy); padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-weight: 500; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.empty { background: var(--card); border: 1px dashed #cfd1e3; border-radius: var(--r); padding: 28px; text-align: center; color: var(--muted); }
.empty.small { padding: 18px; border: 0; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--bg); color: var(--ink-2); white-space: nowrap; }
.st-pending, .st-requested, .st-draft { background: var(--warn-soft); color: var(--warn); }
.st-approved, .st-published, .st-delivered { background: var(--ok-soft); color: var(--ok); }
.st-rejected { background: var(--red-soft); color: var(--red); }
.st-in_progress, .st-ready { background: var(--navy-soft); color: var(--navy); }
.kind { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; flex: none; }
.kind.dpp { background: #e7f0ff; color: #1f5fbf; } .kind.worksheet { background: #fff0e3; color: #b35a00; }

/* substitution table */
.table-wrap { overflow-x: auto; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }
.panel .table-wrap { box-shadow: none; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: #fafbfe; }
td small, th small { display: block; }
table.subs select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--card); max-width: 280px; }
table.subs .why { font-size: 13px; color: var(--ink-2); min-width: 240px; }
.score { color: var(--navy); }
.row-bad { background: var(--red-soft); }
.plan-status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
.absent-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.achip { background: var(--red-soft); color: var(--red); border-radius: 20px; padding: 5px 6px 5px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.achip button { border: 0; background: rgba(224, 31, 39, .12); color: var(--red); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 11px; }
.howto { margin-top: 16px; background: var(--card); border-radius: var(--r); padding: 12px 16px; box-shadow: var(--shadow); }
.howto summary { cursor: pointer; font-weight: 600; color: var(--navy); }

/* my day */
.day { list-style: none; margin: 0; padding: 0; }
.day li { display: flex; gap: 12px; align-items: stretch; padding: 6px 0; }
.ptime { width: 86px; flex: none; display: flex; flex-direction: column; justify-content: center; }
.slot { flex: 1; background: var(--bg); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.slot.free { color: var(--muted); background: transparent; border: 1px dashed var(--line); }
.slot.sub { background: var(--warn-soft); border: 1px solid #f3d29a; }
.slot.off { background: var(--red-soft); color: var(--red); }
.day li.lunch .slot { background: transparent; color: var(--muted); padding: 4px 12px; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.qa { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 22px; }
.qa span { font-size: 13px; font-weight: 600; color: var(--ink-2); text-align: center; }
.qa:hover { border-color: var(--navy); background: var(--navy-soft); }

/* request / leave cards */
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.cards-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-top > div:first-child { display: flex; gap: 10px; align-items: center; min-width: 0; }
.card-top > div > div { display: flex; flex-direction: column; }
.desc { margin: 10px 0 6px; color: var(--ink-2); white-space: pre-wrap; }
.remark { margin: 4px 0; font-size: 13px; background: var(--bg); padding: 7px 10px; border-radius: 8px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.facts span { font-size: 12px; background: var(--bg); padding: 3px 8px; border-radius: 6px; }
.meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.hist { font-size: 12px; margin-top: 6px; color: var(--muted); }
.hist ul { margin: 6px 0 0; padding-left: 18px; }
.card .row-end { margin-top: auto; padding-top: 10px; }

/* timetable grid */
.tt-controls { display: flex; gap: 8px; align-items: center; }
.tt-controls select, .page-head select, .page-head input[type=month] { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--card); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.seg button.active { background: var(--navy); color: #fff; }
table.tt th, table.tt td { border: 1px solid var(--line); text-align: center; min-width: 96px; }
table.tt thead th, table.tt tr:first-child th { background: #fafbfe; }
table.tt th:first-child { min-width: 86px; }
table.tt td b { display: block; font-size: 13px; }
table.tt td small { font-size: 11px; }
table.tt .today { background: #fffbea; }
table.tt th.today { color: var(--navy); }
table.tt td.editable { cursor: pointer; }
table.tt td.editable:hover { outline: 2px solid var(--navy); outline-offset: -2px; }
table.tt .freecell { color: #b0b2c4; }
table.tt .lunchrow td { background: var(--bg); color: var(--muted); font-size: 13px; padding: 4px; }
.subj-MAT { box-shadow: inset 3px 0 #2f3192; } .subj-SCI { box-shadow: inset 3px 0 #128a4b; } .subj-ENG { box-shadow: inset 3px 0 #1f5fbf; }
.subj-HIN { box-shadow: inset 3px 0 #e01f27; } .subj-SST { box-shadow: inset 3px 0 #b35a00; } .subj-SKT { box-shadow: inset 3px 0 #8a5a00; }
.subj-BMT { box-shadow: inset 3px 0 #5b5fd6; } .subj-AI { box-shadow: inset 3px 0 #0a9bb5; } .subj-CNV { box-shadow: inset 3px 0 #d0672a; } .subj-RDG { box-shadow: inset 3px 0 #9a6b2f; }
.subj-URD { box-shadow: inset 3px 0 #3d8f5a; } .subj-PHY { box-shadow: inset 3px 0 #7a3fc4; } .subj-CHE { box-shadow: inset 3px 0 #c43f6b; } .subj-BIO { box-shadow: inset 3px 0 #4a9a1e; }
.subj-MAB { box-shadow: inset 3px 0 #2a7fd0; } .subj-CIV { box-shadow: inset 3px 0 #a0522d; } .subj-HIS { box-shadow: inset 3px 0 #8c6d1f; } .subj-GEO { box-shadow: inset 3px 0 #2e8b74; }
.subj-CMP { box-shadow: inset 3px 0 #0f8a8a; } .subj-GAM { box-shadow: inset 3px 0 #6b4bd8; } .subj-ART { box-shadow: inset 3px 0 #c2407e; } .subj-LIB { box-shadow: inset 3px 0 #7a7d92; }

/* data tables, bars */
table.data tr.inactive { opacity: .55; }
table.data td { vertical-align: middle; }
.bar { position: relative; background: var(--bg); border-radius: 6px; height: 22px; min-width: 140px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #c9cbf0; border-radius: 6px; }
.bar.sub i { background: #f6b9bc; }
.bar span { position: relative; padding-left: 8px; font-size: 12px; font-weight: 700; line-height: 22px; }

/* chat */
.chat { display: flex; flex-direction: column; gap: 10px; }
.chat-log { min-height: 260px; max-height: 52vh; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px; }
.msg { display: flex; gap: 8px; max-width: 86%; }
.msg > div { padding: 10px 13px; border-radius: 12px; background: var(--bg); white-space: normal; }
.msg.user { align-self: flex-end; }
.msg.user > div { background: var(--navy); color: #fff; }
.ai-badge { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--violet-soft); display: inline-flex; align-items: center; justify-content: center; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.chip-btn:hover { border-color: var(--violet); color: var(--violet); }
.chat-in { display: flex; gap: 8px; }
.chat-in input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.typing { white-space: pre-wrap; }

/* notifications, audit */
.notif { list-style: none; margin: 0; padding: 0; }
.notif li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.notif li.unread span { font-weight: 600; }
.audit { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.audit li { display: grid; grid-template-columns: 130px 160px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }

/* forms */
.stack { display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
label.inline { flex-direction: row; align-items: center; gap: 8px; }
input, select, textarea { border: 1px solid #d5d7e5; border-radius: 10px; padding: 9px 11px; background: var(--card); font-weight: 400; color: var(--ink); width: 100%; }
input[type=checkbox] { width: auto; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid #b9bbf0; border-color: var(--navy); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.periods-pick, .checks { display: flex; flex-wrap: wrap; gap: 6px; }
.pp { flex-direction: row; align-items: center; gap: 6px; border: 1px solid var(--line); padding: 6px 10px; border-radius: 8px; font-weight: 500; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
legend { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.error { background: var(--red-soft); color: var(--red); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; }
.phone-in { display: flex; align-items: center; border: 1px solid #d5d7e5; border-radius: 10px; overflow: hidden; background: var(--card); }
.phone-in span { padding: 0 10px; color: var(--muted); border-right: 1px solid var(--line); }
.phone-in input { border: 0; border-radius: 0; }
.draft, .copybox { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 13px; }

/* modal & toast */
.modal-back { position: fixed; inset: 0; background: rgba(20, 22, 50, .45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 14px; overflow: auto; }
.modal { background: var(--card); border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
.modal.wide { max-width: 720px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 16px 18px 18px; }
.modal-body p { margin: 0 0 8px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(30px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; opacity: 0; transition: .25s; z-index: 200; pointer-events: none; font-weight: 500; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 14px; background: linear-gradient(160deg, #2f3192 0%, #24257a 55%, #e01f27 140%); }
.login-card { background: var(--card); border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 420px; box-shadow: 0 30px 80px rgba(0, 0, 0, .3); text-align: center; }
.login-card form { text-align: left; margin-top: 18px; }
.login-logo { width: 96px; height: 96px; object-fit: contain; }
.login-card h1 { color: var(--navy); font-size: 22px; margin-top: 6px; }
.login-card .muted { margin: 4px 0 0; }
.demo-box { margin-top: 18px; text-align: left; background: var(--bg); border-radius: 12px; padding: 12px; font-size: 13px; }
.demo-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.demo-acc { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 9px; cursor: pointer; text-align: left; display: flex; flex-direction: column; }
.demo-acc span { font-weight: 600; font-size: 13px; }
.demo-acc small { font-size: 11px; }
.demo-acc:hover { border-color: var(--navy); }

#print-root { display: none; }
@media print {
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; font-size: 13px; }
}

/* phones */
@media (max-width: 860px) {
  .menu-btn { display: inline-block; }
  .me div, .top-actions .btn.ghost { display: none; }
  .brand span { display: none; }
  .sidebar { position: fixed; top: 59px; left: 0; bottom: 0; height: auto; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 20px rgba(0, 0, 0, .1); }
  .sidebar.open { transform: none; }
  .content { padding: 16px 12px 60px; }
  .grid2, .cards-list { grid-template-columns: 1fr; }
  .cards { grid-template-columns: repeat(2, 1fr); }
  .three { grid-template-columns: 1fr 1fr; }
  .audit li { grid-template-columns: 1fr; gap: 2px; }
  .sidebar .nav.lang-mobile { display: flex; }
}

/* keep small controls compact (global inputs are full width) */
.datebar input, .tt-controls select, .page-head select, .page-head input, table.subs select { width: auto; }
.chat-in input { width: auto; min-width: 0; }

@media (max-width: 860px) {
  table.subs, table.subs tbody { display: block; }
  table.subs thead { display: none; }
  table.subs tr { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; padding: 12px 14px; border-bottom: 6px solid var(--bg); }
  table.subs td { border: 0; padding: 4px 0; }
  table.subs td::before { content: attr(data-label); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  table.subs td:nth-child(5), table.subs td.why { grid-column: 1 / -1; }
  table.subs select { width: 100%; max-width: none; }
  table.subs .why { min-width: 0; }
}

/* live version */
.net { font-size: 11px; padding: 8px 12px 8px 26px; position: relative; color: var(--muted); }
.net::before { content: ''; position: absolute; left: 12px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #c9cbe0; }
.net.ok::before { background: var(--ok); }
.net.busy::before { background: var(--warn); }
.net.bad { color: var(--red); } .net.bad::before { background: var(--red); }
.spinner { width: 34px; height: 34px; border: 3px solid var(--navy-soft); border-top-color: var(--navy); border-radius: 50%; margin: 18px auto 4px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.code { font-family: ui-monospace, Consolas, monospace; font-weight: 700; letter-spacing: .08em; background: var(--warn-soft); color: var(--warn); padding: 2px 7px; border-radius: 6px; }
.bigcode { font-family: ui-monospace, Consolas, monospace; font-size: 34px; font-weight: 800; letter-spacing: .2em; text-align: center; color: var(--navy); background: var(--navy-soft); border-radius: 12px; padding: 12px; margin: 8px 0 12px; }
.login-card .error { margin: 12px 0; text-align: left; }

/* assistant answers */
.md p { margin: 0 0 6px; } .md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 4px 0 6px; padding-left: 20px; }
.md-table { overflow-x: auto; margin: 6px 0; }
.md-table table { border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 8px; }
.md-table th, .md-table td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md-table th { background: var(--navy-soft); color: var(--navy); font-size: 12px; text-transform: none; letter-spacing: 0; }
.md code { background: var(--card); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
.msg.assistant { max-width: 94%; }
.chip-btn:disabled { opacity: .5; cursor: default; }

/* ---- version 2: builder, assistant, phone navigation ---- */
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper input { width: 56px; text-align: center; padding: 6px 4px; }
.stepper .btn { width: 30px; height: 30px; padding: 0; font-size: 16px; }
table.bld td { vertical-align: middle; padding: 7px 10px; }
table.bld select { min-width: 150px; padding: 7px 9px; }
.bld-add { margin-top: 12px; } .bld-add select { width: auto; padding: 7px 9px; }
.inline-field { flex-direction: row; align-items: center; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.inline-field select { width: auto; min-width: 200px; }
.loadlist { max-height: 330px; overflow: auto; }
.bar.over i { background: #f08f93; }
.seg.wide { display: flex; margin-bottom: 12px; } .seg.wide button { flex: 1; padding: 10px; }
.btn.big { padding: 12px 22px; font-size: 16px; }
.error.list ul { margin: 6px 0 0; padding-left: 20px; font-weight: 400; }
.preview { border: 2px solid var(--navy); scroll-margin-top: 70px; }
.qgroup { margin: 10px 4px; } .qgroup b { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.suggest.follow { margin: 0 0 4px 36px; }
.chat-log { max-height: 60vh; }
.quickask { display: flex; gap: 8px; align-items: center; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 8px 10px; margin-bottom: 16px; }
.quickask input { border: 0; flex: 1; min-width: 0; width: auto; } .quickask input:focus { outline: 0; }
.start { border-left: 4px solid var(--red); }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.steps li span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9cbe0; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
.steps li.done span { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li.done .linkbtn { color: var(--muted); text-decoration: line-through; }
.linkbtn { border: 0; background: none; color: var(--navy); font-weight: 600; cursor: pointer; text-align: left; padding: 0; }
.day li.now .slot { outline: 2px solid var(--navy); }
.ptime em { font-style: normal; font-size: 10px; font-weight: 700; color: #fff; background: var(--red); border-radius: 4px; padding: 0 4px; width: fit-content; }
.bottomnav, .menu-back { display: none; }
@media (max-width: 860px) {
  .bottomnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .bottomnav button { flex: 1; border: 0; background: none; padding: 7px 2px 6px; font-size: 11px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; }

  .sidebar { bottom: 0; padding-bottom: 70px; }
  .tt-controls { flex-wrap: wrap; }
  table.bld select { min-width: 110px; }
  .msg { max-width: 100%; } .suggest.follow { margin-left: 0; }
}

/* ===== version 2 ===== */
:root { --card: #fff; --hover: #c9cbe0; }
html[data-theme="dark"] {
  --navy: #8f93ff; --navy-2: #a9acff; --navy-soft: #23254a; --red: #ff6b71; --red-soft: #3a1d22;
  --ink: #e8e9f4; --ink-2: #c3c5da; --muted: #9a9db5; --line: #2e3050; --bg: #101124; --card: #1a1b33;
  --ok: #3ccf82; --ok-soft: #12321f; --warn: #ffb547; --warn-soft: #3a2c12; --violet: #b49cff; --violet-soft: #2a2350;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35); color-scheme: dark;
}
html[data-theme="dark"] body { background: var(--bg); color: var(--ink); }
html[data-theme="dark"] .topbar { background: #16173a; }
html[data-theme="dark"] .btn.primary, html[data-theme="dark"] .btn.ok, html[data-theme="dark"] .btn.danger { color: #0d0e22; }
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { background: #12132a; color: var(--ink); border-color: var(--line); }
html[data-theme="dark"] .empty { border-color: var(--line); }
html[data-theme="dark"] .btn.danger-ghost { border-color: #6a2a30; }
html[data-theme="dark"] table th { background: #202146; }
html[data-theme="dark"] .modal, html[data-theme="dark"] .modal-card, html[data-theme="dark"] .dialog { background: var(--card); color: var(--ink); }

.btn.big { padding: 14px 18px; font-size: 16px; width: 100%; margin-top: 10px; }
.row-end.left { justify-content: flex-start; align-items: center; margin: 0 0 14px; }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.bad { background: var(--red-soft); color: var(--red); }
.chip.small { font-size: 11px; padding: 2px 7px; }
.warn-text { color: var(--warn); font-weight: 700; }
td.bad, .bad { color: var(--red); font-weight: 700; }
.stat.ok { border-left-color: var(--ok); } .stat.ok b { color: var(--ok); }

/* attendance */
.att-card .att-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.att-step { flex: 1; min-width: 110px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; }
.att-step span { color: var(--muted); font-size: 13px; }
.att-step.done { border-color: var(--ok); background: var(--ok-soft); }
.att-step.done span { color: var(--ok); font-weight: 700; }
.chip.att-present { background: var(--ok-soft); color: var(--ok); }
.chip.att-late { background: var(--warn-soft); color: var(--warn); }
.chip.att-review { background: var(--violet-soft); color: var(--violet); }
.chip.att-absent, .chip.att-rejected { background: var(--red-soft); color: var(--red); }
.chip.att-leave { background: var(--navy-soft); color: var(--navy); }
.chip.att-not_in { background: var(--bg); color: var(--muted); }
.att-bar { display: flex; height: 14px; border-radius: 8px; overflow: hidden; background: var(--bg); margin: 4px 0 10px; }
.att-seg { min-width: 0; }
.att-seg.att-present { background: var(--ok); } .att-seg.att-late { background: var(--warn); } .att-seg.att-review { background: var(--violet); }
.att-seg.att-leave { background: var(--navy); } .att-seg.att-not_in { background: #c9cbe0; } .att-seg.att-absent { background: var(--red); }
.att-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
table.register { font-size: 12px; }
table.register th, table.register td { padding: 4px 5px; text-align: center; min-width: 22px; }
table.register td:first-child, table.register th:first-child { text-align: left; white-space: nowrap; }
table.register th.sun { color: var(--red); }
.r-present { color: var(--ok); font-weight: 700; } .r-late { color: var(--warn); font-weight: 700; } .r-absent, .r-rejected { color: var(--red); font-weight: 700; background: var(--red-soft); }
.r-leave { color: var(--navy); } .r-review { color: var(--violet); } .r-holiday { background: var(--bg); }

/* now / next */
.nownext { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; }
html[data-theme="dark"] .nownext { background: linear-gradient(135deg, #2b2e7a, #1e2057); }
.nownext > div { display: flex; flex-direction: column; gap: 2px; }
.nownext small { text-transform: uppercase; letter-spacing: .06em; opacity: .8; font-size: 11px; }
.nownext b { font-size: 18px; }
.nownext span { opacity: .85; font-size: 13px; }

/* leave */
.balances { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.bal { position: relative; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 14px; display: flex; flex-direction: column; overflow: hidden; }
.bal span { font-size: 13px; color: var(--muted); }
.bal b { font-size: 26px; color: var(--ok); }
.bal small { color: var(--muted); font-size: 12px; }
.bal i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--navy); }
.bal.low b { color: var(--warn); } .bal.none b { color: var(--red); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-h { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; padding: 4px 0; }
.cal-cell { min-height: 72px; border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.cal-cell b { font-size: 12px; }
.cal-cell.sun { background: var(--bg); } .cal-cell.today { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.cal-cell.blank { border: 0; }
.cal-ev { font-size: 11px; border-radius: 5px; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
.cal-ev.approved { background: var(--ok-soft); color: var(--ok); } .cal-ev.pending { background: var(--warn-soft); color: var(--warn); } .cal-ev.abs { background: var(--red-soft); color: var(--red); }

/* syllabus */
.sy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.sy-card { text-align: left; cursor: pointer; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font: inherit; color: inherit; background: var(--card); }
.sy-card .bar, .sy-matrix .bar { height: 8px; background: var(--bg); border-radius: 6px; overflow: hidden; position: relative; }
.sy-card .bar i { display: block; height: 100%; background: var(--ok); }
.sy-cell { border: 0; border-radius: 8px; padding: 6px 8px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-width: 64px; font-size: 13px; }
.sy-cell small { font-weight: 500; font-size: 11px; opacity: .8; }
.sy-cell.good { background: var(--ok-soft); color: var(--ok); } .sy-cell.mid { background: var(--warn-soft); color: var(--warn); } .sy-cell.low { background: var(--red-soft); color: var(--red); } .sy-cell.empty { background: var(--bg); color: var(--muted); }
td.na { color: var(--muted); text-align: center; }
.sy-list { padding-left: 22px; margin: 0; }
.sy-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.sy-list li label { flex: 1; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.sy-list li.done span { text-decoration: line-through; color: var(--muted); }

/* exams, notices, misc */
.pick-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
ul.plain { list-style: none; padding: 0; margin: 6px 0; } ul.plain li { padding: 3px 0; border-bottom: 1px solid var(--line); }
.icon-btn.mic { font-size: 18px; }
.icon-btn.mic.on { background: var(--red-soft); animation: micpulse 1s infinite; }
@keyframes micpulse { 50% { box-shadow: 0 0 0 6px rgba(224, 31, 39, .15); } }
.tt td[data-picked] { outline: 3px solid var(--red); outline-offset: -3px; }
.datebar { display: flex; gap: 6px; align-items: center; }
.print-doc h2 { margin: 0 0 4px; } .print-doc h3 { margin: 0 0 12px; font-weight: 600; } .print-doc h4 { margin: 14px 0 6px; }
.print-table { border-collapse: collapse; width: 100%; font-size: 11px; }
.print-table th, .print-table td { border: 1px solid #999; padding: 3px 5px; text-align: left; }
.print-table th { background: #eee; }
.print-foot { margin-top: 12px; color: #666; font-size: 11px; }
@media (max-width: 860px) {
  .nownext { grid-template-columns: 1fr 1fr; }
  .cal-cell { min-height: 54px; }
  .cal-ev { font-size: 10px; }
  .two-col { grid-template-columns: 1fr; }
}

/* Seeded random numbers so the sample timetable is the same every time */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Build a clash-free weekly timetable: no teacher in two classes at once,
   at most 2 periods of a subject per class per day. */
function generateTimetable(mapping, seed) {
  const ND = DAYS.length, NP = PERIODS.length, NS = ND * NP;
  for (let attempt = 0; attempt < 50; attempt++) {
    const rnd = mulberry32(seed + attempt * 7919);
    // each class: a flat list of 48 subject codes, shuffled
    const rows = {};
    CLASSES.forEach(c => {
      const list = [];
      Object.keys(WEEKLY).forEach(s => { for (let i = 0; i < WEEKLY[s]; i++) list.push(s); });
      for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
      rows[c] = list;
    });
    const teacherAt = (c, i) => mapping[c][rows[c][i]];
    // cost of one cell: clashes of its teacher in that slot + too many of that subject that day
    const cellCost = (c, i) => {
      const t = teacherAt(c, i);
      let cost = 0;
      for (const o of CLASSES) if (o !== c && teacherAt(o, i) === t) cost += 1;
      const d = Math.floor(i / NP), s = rows[c][i];
      let same = 0;
      for (let k = d * NP; k < d * NP + NP; k++) if (rows[c][k] === s) same++;
      if (same > 2) cost += same - 2;
      return cost;
    };
    const totalCost = () => { let t = 0; CLASSES.forEach(c => { for (let i = 0; i < NS; i++) t += cellCost(c, i); }); return t; };
    let cost = totalCost();
    for (let step = 0; step < 60000 && cost > 0; step++) {
      const c = CLASSES[Math.floor(rnd() * CLASSES.length)];
      const i = Math.floor(rnd() * NS);
      if (cellCost(c, i) === 0 && rnd() > 0.02) continue;
      let best = null, bestDelta = Infinity;
      for (let tries = 0; tries < 20; tries++) {
        const j = Math.floor(rnd() * NS);
        if (j === i || rows[c][j] === rows[c][i]) continue;
        const before = cellCost(c, i) + cellCost(c, j);
        [rows[c][i], rows[c][j]] = [rows[c][j], rows[c][i]];
        const after = cellCost(c, i) + cellCost(c, j);
        [rows[c][i], rows[c][j]] = [rows[c][j], rows[c][i]];
        const delta = after - before + (rnd() - 0.5) * 0.2;
        if (delta < bestDelta) { bestDelta = delta; best = j; }
      }
      if (best !== null && bestDelta <= 0.1) {
        [rows[c][i], rows[c][best]] = [rows[c][best], rows[c][i]];
        if (step % 200 === 0) cost = totalCost();
      }
      if (step % 1000 === 0) cost = totalCost();
    }
    cost = totalCost();
    if (cost === 0) {
      const tt = {};
      CLASSES.forEach(c => {
        tt[c] = [];
        for (let d = 0; d < ND; d++) {
          tt[c].push([]);
          for (let p = 0; p < NP; p++) { const s = rows[c][d * NP + p]; tt[c][d].push({ s, t: mapping[c][s] }); }
        }
      });
      return tt;
    }
  }
  throw new Error('Could not build sample timetable');
}

/* ===== State, storage and the substitution engine ===== */
let S = null; // whole app state

/* ---------- small helpers ---------- */
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
/* 0 = Monday … 5 = Saturday, -1 = Sunday */
const dayIdx = iso => { const g = parseISO(iso).getDay(); return g === 0 ? -1 : g - 1; };
const weekStart = iso => { const d = parseISO(iso); const g = d.getDay(); const back = g === 0 ? 6 : g - 1; d.setDate(d.getDate() - back); return toISO(d); };
const nowStamp = () => new Date().toISOString();
const fmtDate = iso => {
  if (!iso) return '';
  const d = parseISO(iso);
  return d.toLocaleDateString(S && S.lang === 'hi' ? 'hi-IN' : 'en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
};
const fmtTime = ts => new Date(ts).toLocaleString(S && S.lang === 'hi' ? 'hi-IN' : 'en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

/* ---------- storage ----------
   Data lives in the shared Supabase database (see sync.js). */
function saveState() { queueFlush(); }

/* ---------- lookups ---------- */
const staffById = id => S.staff.find(s => s.id === id);
const nameOf = id => (staffById(id) || { name: id === 'system' ? 'System' : '—' }).name;
const teachers = () => S.staff.filter(s => s.role === 'teacher' && s.active);
const subjName = code => (SUBJECTS[code] ? SUBJECTS[code][S.lang] || SUBJECTS[code].en : code);
const isManager = u => u && (u.role === 'admin' || u.role === 'coordinator');

function lessonAt(cls, d, p) { return (S.tt[cls] && S.tt[cls][d] && S.tt[cls][d][p - 1]) || null; }
/* A period can hold more than one group at the same time (for example Sanskrit / Urdu):
   the first group is { s, t }; further groups are in x: [{ s, t }].
   j: true marks a combined class, where the same teacher takes two classes together. */
function partsOf(l) { return l ? [{ s: l.s, t: l.t }].concat(Array.isArray(l.x) ? l.x.filter(g => g && g.s) : []) : []; }
const cellSubj = l => partsOf(l).map(g => subjName(g.s)).join(' / ');
const cellTeachers = (l, short) => partsOf(l).map(g => (short ? nameOf(g.t).split(' ')[0] : nameOf(g.t))).join(' / ');
function teacherLessonAt(tid, d, p) {
  let hit = null;
  for (const c of CLASSES) {
    const parts = partsOf(lessonAt(c, d, p));
    const i = parts.findIndex(g => g.t === tid);
    if (i < 0) continue;
    if (!hit) hit = { cls: c, s: parts[i].s, t: tid, part: i, classes: [c] };
    else hit.classes.push(c);
  }
  if (hit) hit.label = hit.classes.join(' + ');
  return hit;
}
function periodsOnDay(tid, d) { let n = 0; for (let p = 1; p <= PERIODS.length; p++) if (teacherLessonAt(tid, d, p)) n++; return n; }
function weeklyLoad(tid) { let n = 0; for (let d = 0; d < DAYS.length; d++) n += periodsOnDay(tid, d); return n; }
function teachesClass(tid, cls) { return !!(S.tt[cls] && S.tt[cls].some(day => day.some(l => partsOf(l).some(g => g.t === tid)))); }

/* ---------- absences ---------- */
function scopePeriods(scope, periods) {
  if (scope === 'first') return PERIODS.filter(p => p.n <= LUNCH.after).map(p => p.n);
  if (scope === 'second') return PERIODS.filter(p => p.n > LUNCH.after).map(p => p.n);
  if (scope === 'periods') return (periods || []).map(Number);
  return PERIODS.map(p => p.n);
}
const absencesOn = date => S.absences.filter(a => a.date === date);
function isAbsent(tid, date, p) { return S.absences.some(a => a.teacherId === tid && a.date === date && scopePeriods(a.scope, a.periods).includes(p)); }
function absenceLabel(a) {
  if (a.scope === 'full') return t('fullDay');
  if (a.scope === 'first') return t('firstHalf');
  if (a.scope === 'second') return t('secondHalf');
  return 'P' + scopePeriods(a.scope, a.periods).join(', P');
}

/* ---------- the substitution engine ---------- */
/* Every period an absent teacher leaves empty */
function computeGaps(date) {
  const d = dayIdx(date);
  if (d < 0) return [];
  const gaps = [];
  for (const a of absencesOn(date)) {
    for (const p of scopePeriods(a.scope, a.periods)) {
      const l = teacherLessonAt(a.teacherId, d, p);
      if (l) gaps.push({ key: `${l.cls}|${p}` + (l.part ? `|g${l.part}` : ''), cls: l.cls, p, subject: l.s, absentId: a.teacherId });
    }
  }
  // de-duplicate (same teacher marked twice)
  const seen = new Set();
  return gaps.filter(g => (seen.has(g.key) ? false : seen.add(g.key))).sort((a, b) => a.p - b.p || CLASSES.indexOf(a.cls) - CLASSES.indexOf(b.cls));
}

/* Substitutions a teacher already has in the same week, before this date */
function weekSubsBefore(tid, date) {
  const ws = weekStart(date);
  let n = 0;
  for (const [dt, plan] of Object.entries(S.plans)) {
    if (dt >= ws && dt < date) n += Object.values(plan.items).filter(i => i.teacherId === tid).length;
  }
  return n;
}

/* Rank every possible substitute for one gap.
   others = substitutions already placed today (excluding this gap). */
function rankCandidates(date, gap, others) {
  const d = dayIdx(date);
  const w = S.settings;
  const out = [];
  for (const tch of teachers()) {
    if (isAbsent(tch.id, date, gap.p)) continue;
    if (teacherLessonAt(tch.id, d, gap.p)) continue;
    if (others.some(o => o.teacherId === tch.id && o.p === gap.p)) continue;
    const subsToday = others.filter(o => o.teacherId === tch.id).length;
    if (subsToday >= w.dailyCap) continue;
    let score = 0;
    const why = [];
    if (tch.subjects.includes(gap.subject)) { score += w.subject; why.push({ en: `teaches ${SUBJECTS[gap.subject].en}`, hi: `${SUBJECTS[gap.subject].hi} पढ़ाते हैं`, pts: +w.subject }); }
    if (teachesClass(tch.id, gap.cls)) { score += w.classKnown; why.push({ en: `already teaches ${gap.cls}`, hi: `${gap.cls} को पहले से पढ़ाते हैं`, pts: +w.classKnown }); }
    if (S.classTeachers[gap.cls] === tch.id) { score += w.classTeacher; why.push({ en: `class teacher of ${gap.cls}`, hi: `${gap.cls} के कक्षा-शिक्षक`, pts: +w.classTeacher }); }
    const load = periodsOnDay(tch.id, d) + subsToday;
    score -= w.periodLoad * load;
    why.push({ en: `${load} periods today`, hi: `आज ${load} पीरियड`, pts: -w.periodLoad * load });
    const wk = weekSubsBefore(tch.id, date) + subsToday;
    if (wk) { score -= w.weekSubs * wk; why.push({ en: `${wk} substitution${wk > 1 ? 's' : ''} this week`, hi: `इस सप्ताह ${wk} अरेंजमेंट`, pts: -w.weekSubs * wk }); }
    const busy = p => p >= 1 && p <= PERIODS.length && (!!teacherLessonAt(tch.id, d, p) || others.some(o => o.teacherId === tch.id && o.p === p));
    const p = gap.p;
    // lunch breaks the run between P4 and P5
    const run = (a, b) => busy(a) && busy(b) && !((a <= 4 && b >= 5) || (a <= 4 && p >= 5) || (p <= 4 && b >= 5));
    if (run(p - 2, p - 1) || run(p - 1, p + 1) || run(p + 1, p + 2)) {
      score -= w.consecutive; why.push({ en: 'would make 3 periods in a row', hi: 'लगातार 3 पीरियड हो जाएँगे', pts: -w.consecutive });
    }
    out.push({ id: tch.id, score, why });
  }
  out.sort((a, b) => b.score - a.score || nameOf(a.id).localeCompare(nameOf(b.id)));
  return out;
}

/* Build (or refresh) the substitution plan for a date.
   Manual choices that are still valid are kept. */
function generatePlan(date, by) {
  const gaps = computeGaps(date);
  const old = S.plans[date];
  if (!gaps.length) {
    if (old) { delete S.plans[date]; }
    return null;
  }
  const items = {};
  const placed = [];
  for (const g of gaps) {
    const prev = old && old.items[g.key];
    const ranked = rankCandidates(date, g, placed);
    let choice = null;
    if (prev && prev.manual && prev.teacherId && ranked.find(r => r.id === prev.teacherId)) choice = ranked.find(r => r.id === prev.teacherId);
    else if (prev && prev.teacherId && old.status === 'published' && ranked.find(r => r.id === prev.teacherId)) choice = ranked.find(r => r.id === prev.teacherId);
    else choice = ranked[0] || null;
    const item = {
      key: g.key, cls: g.cls, p: g.p, subject: g.subject, absentId: g.absentId,
      teacherId: choice ? choice.id : null, score: choice ? choice.score : null, why: choice ? choice.why : [],
      manual: !!(prev && prev.manual && choice && prev.teacherId === choice.id),
      alternatives: ranked.filter(r => !choice || r.id !== choice.id).slice(0, 2).map(r => ({ id: r.id, score: r.score })),
    };
    items[g.key] = item;
    if (item.teacherId) placed.push({ teacherId: item.teacherId, p: g.p });
  }
  const changed = !old || JSON.stringify(Object.values(old.items).map(i => [i.key, i.teacherId])) !== JSON.stringify(Object.values(items).map(i => [i.key, i.teacherId]));
  const status = old && old.status === 'published' && !changed ? 'published' : 'draft';
  S.plans[date] = {
    date, items, status,
    changedAfterPublish: !!(old && old.status === 'published' && changed) || !!(old && old.changedAfterPublish && status === 'draft'),
    updatedAt: nowStamp(), updatedBy: by || 'system', publishedAt: old ? old.publishedAt : null,
  };
  return S.plans[date];
}

/* Admin overrides one slot */
function setSubstitute(date, key, tid, by) {
  const plan = S.plans[date];
  if (!plan) return;
  const item = plan.items[key];
  const others = Object.values(plan.items).filter(i => i.key !== key && i.teacherId).map(i => ({ teacherId: i.teacherId, p: i.p }));
  const ranked = rankCandidates(date, item, others);
  const r = ranked.find(x => x.id === tid);
  item.teacherId = tid || null;
  item.score = r ? r.score : null;
  item.why = r ? r.why : [];
  item.manual = true;
  item.alternatives = ranked.filter(x => x.id !== tid).slice(0, 2).map(x => ({ id: x.id, score: x.score }));
  if (plan.status === 'published') { plan.status = 'draft'; plan.changedAfterPublish = true; }
  plan.updatedAt = nowStamp(); plan.updatedBy = by;
  logAudit(by, `Changed ${item.cls} P${item.p} on ${date} to ${tid ? nameOf(tid) : 'not covered'}`);
}

function publishPlan(date, by) {
  const plan = S.plans[date];
  if (!plan) return;
  plan.status = 'published';
  plan.changedAfterPublish = false;
  plan.publishedAt = nowStamp();
  const perTeacher = {};
  Object.values(plan.items).forEach(i => { if (i.teacherId) (perTeacher[i.teacherId] = perTeacher[i.teacherId] || []).push(i); });
  Object.entries(perTeacher).forEach(([tid, list]) => {
    const txt = list.map(i => `P${i.p} ${i.cls} ${SUBJECTS[i.subject].en}`).join(', ');
    notify(tid, `Arrangement on ${fmtDate(date)}: ${txt}`, { en: `Arrangement on ${fmtDate(date)}: ${txt}`, hi: `${fmtDate(date)} को अरेंजमेंट: ${txt}` });
  });
  logAudit(by, `Published substitution plan for ${date} (${Object.keys(plan.items).length} periods)`);
}

/* ---------- leave ---------- */
function eachSchoolDay(from, to, fn) { let d = from; let guard = 0; while (d <= to && guard++ < 60) { if (dayIdx(d) >= 0) fn(d); d = addDays(d, 1); } }

function decideLeave(id, approve, remark, by) {
  const lv = S.leaves.find(l => l.id === id);
  if (!lv) return;
  lv.status = approve ? 'approved' : 'rejected';
  lv.remark = remark || '';
  lv.decidedBy = by; lv.decidedAt = nowStamp();
  if (approve) {
    eachSchoolDay(lv.from, lv.to, d => {
      S.absences.push({ id: uid('ab'), teacherId: lv.teacherId, date: d, scope: lv.scope, periods: lv.periods, note: `${lv.type} leave`, source: 'leave', leaveId: lv.id, createdAt: nowStamp() });
      if (d >= todayISO()) generatePlan(d, by);
    });
  }
  notify(lv.teacherId, '', {
    en: `Your leave (${fmtDate(lv.from)}${lv.to !== lv.from ? ' – ' + fmtDate(lv.to) : ''}) was ${approve ? 'approved' : 'rejected'}${remark ? ': ' + remark : ''}`,
    hi: `आपकी छुट्टी (${fmtDate(lv.from)}${lv.to !== lv.from ? ' – ' + fmtDate(lv.to) : ''}) ${approve ? 'स्वीकृत' : 'अस्वीकृत'} हुई${remark ? ': ' + remark : ''}`,
  });
  logAudit(by, `${approve ? 'Approved' : 'Rejected'} leave of ${nameOf(lv.teacherId)} (${lv.from} to ${lv.to})`);
}

function addAbsence(tid, date, scope, periods, note, by) {
  S.absences.push({ id: uid('ab'), teacherId: tid, date, scope, periods, note, source: 'admin', createdAt: nowStamp() });
  generatePlan(date, by);
  logAudit(by, `Marked ${nameOf(tid)} absent on ${date} (${scope})`);
}
function removeAbsence(id, by) {
  const a = S.absences.find(x => x.id === id);
  if (!a) return;
  S.absences = S.absences.filter(x => x.id !== id);
  generatePlan(a.date, by);
  logAudit(by, `Removed absence of ${nameOf(a.teacherId)} on ${a.date}`);
}

/* ---------- notifications & audit ---------- */
function notify(userId, text, both) {
  S.notifications.unshift({ id: uid('nf'), userId, en: (both && both.en) || text, hi: (both && both.hi) || text, at: nowStamp(), read: false });
  if (S.notifications.length > 300) S.notifications.length = 300;
}
function notifyManagers(both) { S.staff.filter(s => isManager(s) && s.active).forEach(s => notify(s.id, '', both)); }

const TEACHER_WRITABLE = new Set(['leaves', 'requests', 'notifications', 'audit', 'acks', 'syllabus']);
const NO_DELETE = new Set(['notifications', 'audit']);

const LAST = {};               // what the server has: table -> Map(id -> JSON text)

/* ---------- local state <-> table rows ---------- */
function tableToMap(t) {
  switch (t) {
    case 'staff': return new Map(S.staff.map(x => [x.id, x]));
    case 'timetable': return new Map(Object.entries(S.tt));
    case 'settings': {
      const d = { weights: S.settings, classTeachers: S.classTeachers };
      if (Object.keys(S.curriculum).length) d.curriculum = S.curriculum;
      if (Object.keys(S.customSubjects).length) d.subjects = S.customSubjects;
      return new Map([['main', d]]);
    }
    case 'plans': return new Map(Object.entries(S.plans));
    case 'acks': return new Map(Object.entries(S.acks));
    case 'config': return new Map(Object.entries(S.config));
    default: return new Map(S[t].map(x => [x.id, x]));
  }
}
function applyRow(t, id, data) {
  const del = data == null;
  switch (t) {
    case 'staff': { const i = S.staff.findIndex(x => x.id === id); if (del) { if (i >= 0) S.staff.splice(i, 1); } else if (i >= 0) S.staff[i] = data; else S.staff.push(data); sortStaff(); break; }
    case 'timetable': if (del) delete S.tt[id]; else S.tt[id] = data; syncClasses(); break;
    case 'settings': if (!del && id === 'main') { S.settings = { ...S.settings, ...(data.weights || {}) }; S.classTeachers = data.classTeachers || {}; S.curriculum = data.curriculum || {}; S.customSubjects = data.subjects || {}; Object.assign(SUBJECTS, S.customSubjects); } break;
    case 'plans': if (del) delete S.plans[id]; else S.plans[id] = data; break;
    case 'acks': if (del) delete S.acks[id]; else S.acks[id] = data; break;
    case 'config': if (del) delete S.config[id]; else S.config[id] = data; break;
    default: {
      const arr = S[t]; const i = arr.findIndex(x => x.id === id);
      if (del) { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = data; else arr.unshift(data);
    }
  }
}
function sortStaff() {
  const rank = { admin: 0, coordinator: 1, teacher: 2 };
  S.staff.sort((a, b) => (rank[a.role] ?? 3) - (rank[b.role] ?? 3) || a.name.localeCompare(b.name));
}
function syncClasses() {
  const sec = c => { const i = SECTION_ORDER.indexOf(c.replace(/^\d+[\s\-]*/, '').toUpperCase()); return i < 0 ? 99 : i; };
  const keys = Object.keys(S.tt).sort((a, b) => parseInt(a) - parseInt(b) || sec(a) - sec(b) || a.localeCompare(b));
  if (keys.length) { CLASSES.length = 0; keys.forEach(k => CLASSES.push(k)); }
}

/* ---------- load everything this person may see ---------- */
async function loadAll() {
  const results = await Promise.all(TABLES.map(t => {
    let q = SB.from(t).select('id,data');
    if (t === 'attendance') q = q.gte('data->>date', addDays(todayISO(), -70)).limit(5000);
    else if (t === 'notifications') q = q.order('updated_at', { ascending: false }).limit(200);
    else if (t === 'audit') q = q.order('updated_at', { ascending: false }).limit(300);
    else q = q.limit(5000);
    return q;
  }));
  const fresh = emptyState();
  fresh.lang = S.lang; fresh.session = S.session;
  S = fresh;
  S.v2Missing = false;
  results.forEach((res, k) => {
    const t = TABLES[k];
    if (res.error && V2_TABLES.has(t)) { S.v2Missing = true; LAST[t] = new Map(); return; }
    if (res.error) throw res.error;
    LAST[t] = new Map();
    res.data.forEach(r => { LAST[t].set(r.id, JSON.stringify(r.data)); });
    // newest first for lists that come ordered
    const rows = (t === 'notifications' || t === 'audit') ? res.data.slice().reverse() : res.data;
    rows.forEach(r => applyRow(t, r.id, r.data));
  });
  sortStaff(); syncClasses();
}

async function reloadTable(t) {
  let rq = SB.from(t).select('id,data');
  if (t === 'attendance') rq = rq.gte('data->>date', addDays(todayISO(), -70));
  const { data, error } = await rq.limit(5000);
  if (error) return;
  const keep = t === 'notifications' || t === 'audit';
  if (!keep) {
    if (t === 'staff') S.staff = []; else if (t === 'timetable') S.tt = {}; else if (t === 'plans') S.plans = {}; else if (t === 'acks') S.acks = {}; else if (t === 'config') S.config = {}; else if (t !== 'settings') S[t] = [];
  }
  LAST[t] = new Map();
  data.forEach(r => { LAST[t].set(r.id, JSON.stringify(r.data)); applyRow(t, r.id, r.data); });
}

/* ---------- save local changes ---------- */
function queueFlush() { flushChain = flushChain.then(flushNow, flushNow); return flushChain; }
async function flushNow() {
  const u = me();
  if (!u || !SB) return;
  const mgr = isManager(u);
  NET.saving = true; updateNetBadge();
  let failed = '';
  for (const t of TABLES) {
    if (!mgr && !TEACHER_WRITABLE.has(t)) continue;
    if (S.v2Missing && V2_TABLES.has(t)) continue;
    if (S.offline) continue;
    const cur = tableToMap(t), last = LAST[t] || (LAST[t] = new Map());
    const inserts = [], updates = [], dels = [];
    for (const [id, data] of cur) {
      const js = JSON.stringify(data);
      if (!last.has(id)) inserts.push({ id, data, js });
      else if (last.get(id) !== js) updates.push({ id, data, js });
    }
    if (!NO_DELETE.has(t)) for (const id of last.keys()) if (!cur.has(id)) dels.push(id);
    try {
      if (inserts.length) {
        const { error } = await SB.from(t).insert(inserts.map(r => ({ id: r.id, data: r.data })));
        if (error) throw error;
        inserts.forEach(r => last.set(r.id, r.js));
      }
      for (const r of updates) {
        const { data, error } = await SB.from(t).update({ data: r.data }).eq('id', r.id).select('id');
        if (error) throw error;
        if (!data || !data.length) throw { code: '42501', message: 'not allowed' };
        last.set(r.id, r.js);
      }
      if (dels.length) {
        const { error } = await SB.from(t).delete().in('id', dels);
        if (error) throw error;
        dels.forEach(id => last.delete(id));
      }
    } catch (e) {
      const denied = e && (e.code === '42501' || /row-level security|not allowed|permission/i.test(e.message || ''));
      if (denied) { await reloadTable(t); failed = 'denied'; }
      else failed = failed || 'network';
    }
  }
  NET.saving = false;
  NET.error = failed;
  updateNetBadge();
  if (failed === 'denied') { toast(L('That change is not allowed for your role — it was undone.', 'आपकी भूमिका में यह बदलाव अनुमत नहीं — वापस कर दिया गया।')); render(); }
  else if (failed === 'network') toast(L('Could not save — check internet. Will retry automatically.', 'सहेज नहीं सका — इंटरनेट जाँचें। अपने-आप फिर कोशिश होगी।'));
}
setInterval(() => { if (NET.error === 'network' && me()) queueFlush(); }, 20000);
window.addEventListener('online', () => { if (me()) queueFlush(); });

/* ---------- live updates from other phones ---------- */
let channel = null;
function subscribeLive() {
  if (channel) SB.removeChannel(channel);
  channel = SB.channel('mts-live')
    .on('postgres_changes', { event: '*', schema: 'public' }, payload => {
      const t = payload.table;
      if (!TABLES.includes(t)) return;
      const last = LAST[t] || (LAST[t] = new Map());
      if (payload.eventType === 'DELETE') {
        const id = payload.old && payload.old.id; if (!id) return;
        last.delete(id); applyRow(t, id, null);
      } else {
        const row = payload.new; if (!row || !row.id) return;
        const js = JSON.stringify(row.data);
        if (last.get(row.id) === js) return; // our own change coming back
        last.set(row.id, js); applyRow(t, row.id, row.data);
      }
      scheduleRender();
    })
    .subscribe(status => { NET.live = status === 'SUBSCRIBED'; updateNetBadge(); });
}

/* re-draw after live changes, but never while someone is typing or in a dialog */
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    const a = document.activeElement;
    const typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
    if (document.getElementById('modal-root').innerHTML || typing) { renderPending = true; setTimeout(scheduleRender, 1500); return; }
    renderPending = false; render();
  }, 200);
}

function updateNetBadge() {
  const el = document.getElementById('net');
  if (!el) return;
  el.className = 'net ' + (NET.error ? 'bad' : NET.saving ? 'busy' : NET.live ? 'ok' : 'busy');
  el.textContent = NET.error ? L('Not saved — offline', 'सहेजा नहीं — ऑफ़लाइन') : NET.saving ? L('Saving…', 'सहेज रहा है…') : NET.live ? L('Live · all changes saved', 'लाइव · सब सहेजा गया') : L('Connecting…', 'जुड़ रहा है…');
}

  SB = window.supabase.createClient(APP_CONFIG.url, APP_CONFIG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'mts-auth' } });
  const timer = setTimeout(() => { if (loadOfflineCopy()) { UI.date = todayISO(); render(); return; } showFatal(L('Could not connect. Check internet and refresh the page.', 'कनेक्ट नहीं हो सका। इंटरनेट जाँचकर पेज रीफ़्रेश करें।')); }, 20000);

function renderView(v) {
  switch (v) {
    case 'dashboard': return viewDashboard();

/* ---------- substitution plan ---------- */
function whyText(item) {
  if (!item.teacherId) return `<span class="bad">${L('Nobody free — merge classes or use library period', 'कोई खाली नहीं — कक्षाएँ मिलाएँ या पुस्तकालय पीरियड दें')}</span>`;
  return esc(item.why.map(w => (S.lang === 'hi' ? w.hi : w.en) + ` (${w.pts > 0 ? '+' : ''}${w.pts})`).join(' · ')) + ` <b class="score">= ${item.score}</b>`;
}
function viewSubs() {

  const d = dayIdx(date);
  const abs = absencesOn(date);
  const plan = S.plans[date];
  const gaps = computeGaps(date);
  let body = '';
  if (d < 0) body = `<div class="banner">${t('noClasses')}</div>`;
  else if (!gaps.length) body = `<div class="empty">✅ ${L('No periods to cover on this day.', 'इस दिन कोई पीरियड खाली नहीं है।')}</div>`;
  else {
    const items = Object.values(plan.items).sort((a, b) => a.p - b.p || CLASSES.indexOf(a.cls) - CLASSES.indexOf(b.cls));

    <div class="plan-status">${statusChip(plan.status)}

      ${plan.changedAfterPublish ? `<span class="chip st-rejected">${L('Changed — publish again', 'बदला गया — फिर प्रकाशित करें')}</span>` : ''}

      <tbody>${items.map(i => {
        const others = items.filter(o => o.key !== i.key && o.teacherId).map(o => ({ teacherId: o.teacherId, p: o.p }));

      <button class="btn ghost" data-act="printSheet">🖨️ ${t('print')}</button>

      <p>${L('Only teachers who are present, free in that period and under the daily limit are considered. Each gets points:', 'केवल वही शिक्षक जो उपस्थित हैं, उस पीरियड में खाली हैं और दैनिक सीमा से कम हैं। अंक:')}</p>
      <ul><li>${L('Same subject', 'वही विषय')} +${S.settings.subject}</li><li>${L('Already teaches the class', 'उस कक्षा को पढ़ाते हैं')} +${S.settings.classKnown}</li><li>${L('Class teacher', 'कक्षा-शिक्षक')} +${S.settings.classTeacher}</li>

}

function sheetText(date) {
  const plan = S.plans[date];
  if (!plan) return '';
  const rows = Object.values(plan.items).sort((a, b) => a.p - b.p);
  return `${SCHOOL.name}, ${SCHOOL.place}\nArrangement (substitution) sheet — ${fmtDate(date)}\n\n` +
    rows.map(i => `P${i.p} (${periodTime(i.p)})  ${i.cls}  ${SUBJECTS[i.subject].en}  —  ${i.teacherId ? nameOf(i.teacherId) : 'NOT COVERED'}  (for ${nameOf(i.absentId)})`).join('\n');
}

/* ---------- teacher: my day ---------- */
function viewMyDay() {
  const u = me();
  const date = UI.date;
  const d = dayIdx(date);
  const plan = S.plans[date];
  const subs = plan && plan.status === 'published' ? Object.values(plan.items).filter(i => i.teacherId === u.id) : [];
  const myAbs = S.absences.filter(a => a.teacherId === u.id && a.date === date);
  let rows = '';
  if (d >= 0) {
    PERIODS.forEach(pp => {
      const p = pp.n;
      const l = teacherLessonAt(u.id, d, p);
      const sub = subs.find(i => i.p === p);
      const absent = isAbsent(u.id, date, p);
      let cell;
      if (absent) cell = `<div class="slot off">${l ? `<s>${esc(l.label)} · ${esc(subjName(l.s))}</s> · ` : ''}${t('onLeave')}</div>`;
      else if (sub) cell = `<div class="slot sub"><b>${t('substitution')}:</b> ${esc(sub.cls)} · ${esc(subjName(sub.subject))} <small>(${t('forTeacher')} ${esc(nameOf(sub.absentId))})</small>
        ${isAcked(date, sub.key, u.id) ? `<span class="ok-text">✓ ${t('seen')}</span>` : `<button class="btn tiny primary" data-act="ackSub" data-key="${esc(sub.key)}">${t('markSeen')}</button>`}</div>`;
      else if (l) cell = `<div class="slot"><b>${esc(l.label)}</b> · ${esc(subjName(l.s))}</div>`;
      else cell = `<div class="slot free">${t('free')}</div>`;
      rows += `<li class="${date === todayISO() && currentPeriod() === p ? 'now' : ''}"><div class="ptime"><b>P${p}</b><small>${periodTime(p)}</small>${date === todayISO() && currentPeriod() === p ? `<em>${L('NOW', 'अभी')}</em>` : ''}</div>${cell}</li>`;
      if (p === LUNCH.after) rows += `<li class="lunch"><div class="ptime"><small>${LUNCH.start}–${LUNCH.end}</small></div><div class="slot">🍱 ${t('lunch')}</div></li>`;
    });
  }
  const pendingSubs = subs.filter(s => !isAcked(date, s.key, u.id)).length;
  const myOpen = S.requests.filter(r => r.teacherId === u.id && !['delivered', 'rejected'].includes(r.status)).length;
  const myLeave = S.leaves.filter(l => l.teacherId === u.id && l.status === 'pending').length;
  return `
  <div class="page-head"><h2>${L('Namaste', 'नमस्ते')}, ${esc(u.name.split(' ')[0])} 🙏</h2>${dateBar()}</div>
  ${myAbs.length ? `<div class="banner">${t('onLeave')} — ${esc(myAbs.map(absenceLabel).join(', '))}</div>` : ''}
  ${pendingSubs ? `<div class="banner warn">${L(`You have ${pendingSubs} arrangement period(s). Tap "Mark as seen" so the office knows.`, `आपके ${pendingSubs} अरेंजमेंट पीरियड हैं। "देख लिया" दबाएँ ताकि ऑफ़िस को पता चले।`)}</div>` : ''}
  ${nowNextHTML()}
  <div class="grid2">${checkCardHTML() ? `<div>${checkCardHTML()}</div>` : ''}${myDayExtrasHTML(date)}</div>
  <div class="grid2">
    <section class="panel"><div class="panel-head"><h3>${t('myDay')} · ${fmtDate(date)}</h3></div>
      ${d < 0 ? `<p class="muted">${t('noClasses')}</p>` : `<ul class="day">${rows}</ul>`}
    </section>
    <section class="panel">
      <div class="panel-head"><h3>${L('Quick actions', 'त्वरित कार्य')}</h3></div>
      <div class="quick">
        <button class="qa" data-act="leaveForm">📝<span>${t('applyLeave')}</span></button>
        <button class="qa" data-act="newRequest" data-kind="dpp">🧮<span>${t('raiseDpp')}</span></button>
        <button class="qa" data-act="newRequest" data-kind="worksheet">📄<span>${t('raiseWs')}</span></button>
        <button class="qa" data-act="go" data-view="timetable">📅<span>${L('Class timetables', 'कक्षा समय-सारणी')}</span></button>
      </div>
      <ul class="list compact">
        <li><span>${L('Periods this week', 'इस सप्ताह पीरियड')}</span><b>${weeklyLoad(u.id)}</b></li>
        <li><span>${L('My open requests', 'मेरे खुले अनुरोध')}</span><b>${myOpen}</b></li>
        <li><span>${L('Leave waiting for approval', 'स्वीकृति हेतु छुट्टी')}</span><b>${myLeave}</b></li>
        ${S.classTeachers && Object.entries(S.classTeachers).find(([, v]) => v === u.id) ? `<li><span>${L('Class teacher of', 'कक्षा-शिक्षक')}</span><b>${Object.entries(S.classTeachers).filter(([, v]) => v === u.id).map(([k]) => k).join(', ')}</b></li>` : ''}
      </ul>
    </section>
  </div>`;
}

/* ---------- timetable ---------- */
function viewTimetable() {
  const u = me();
  const manager = isManager(u);
  if (!manager && UI.ttMode === 'teacher' && !UI._ttInit) { UI.ttTeacher = u.id; }
  UI._ttInit = true;
  if (!CLASSES.includes(UI.ttClass)) UI.ttClass = CLASSES[0];
  if (!staffById(UI.ttTeacher)) UI.ttTeacher = (teachers()[0] || {}).id;
  const today = dayIdx(todayISO());
  const mode = UI.ttMode;
  let head = `<tr><th>${t('period')}</th>${DAYS.map((d, i) => `<th class="${i === today ? 'today' : ''}">${S.lang === 'hi' ? DAYS_HI[i].slice(0, 3) : d}</th>`).join('')}</tr>`;
  let rows = '';
  PERIODS.forEach(pp => {
    const p = pp.n;
    rows += `<tr><th><b>P${p}</b><small>${periodTime(p)}</small></th>` + DAYS.map((_, d) => {
      if (mode === 'class') {
        const l = lessonAt(UI.ttClass, d, p);
        const swapOn = manager && V2.swapFrom;
        const picked = swapOn && V2.swapFrom !== 'on' && V2.swapFrom.d === d && V2.swapFrom.p === p;
        const edit = manager ? `data-act="${swapOn ? 'swapPick' : 'editCell'}" data-d="${d}" data-p="${p}"${picked ? ' data-picked="1"' : ''}` : '';
        if (!l) return `<td class="${d === today ? 'today' : ''} freecell ${manager ? 'editable' : ''}" ${edit}>—</td>`;
        return `<td class="${d === today ? 'today' : ''} subj-${l.s} ${manager ? 'editable' : ''}" ${edit}><b>${esc(cellSubj(l))}</b><small>${esc(cellTeachers(l))}${l.j ? ' · ' + L('combined', 'संयुक्त') : ''}</small></td>`;
      }
      const l = teacherLessonAt(UI.ttTeacher, d, p);
      return l ? `<td class="${d === today ? 'today' : ''} subj-${l.s}"><b>${esc(l.label)}</b><small>${esc(subjName(l.s))}</small></td>` : `<td class="${d === today ? 'today' : ''} freecell">${t('free')}</td>`;
    }).join('') + '</tr>';
    if (p === LUNCH.after) rows += `<tr class="lunchrow"><th><small>${LUNCH.start}–${LUNCH.end}</small></th><td colspan="${DAYS.length}">🍱 ${t('lunch')}</td></tr>`;
  });
  const ct = mode === 'class' ? S.classTeachers[UI.ttClass] : null;
  return `<div class="page-head"><h2>${t('timetable')}</h2>
    <div class="tt-controls">
      <div class="seg"><button class="${mode === 'class' ? 'active' : ''}" data-act="ttMode" data-mode="class">${t('class')}</button><button class="${mode === 'teacher' ? 'active' : ''}" data-act="ttMode" data-mode="teacher">${t('teacher')}</button></div>
      ${mode === 'class' ? `<select data-change="ttClass" aria-label="Class">${classOptions(UI.ttClass)}</select>` : `<select data-change="ttTeacher" aria-label="Teacher">${teacherOptions(UI.ttTeacher)}</select>`}
      ${manager && mode === 'class' ? `<button class="btn ${V2.swapFrom ? 'primary' : 'ghost'}" data-act="swapMode">⇄ ${V2.swapFrom ? L('Done swapping', 'बदलना पूरा') : L('Swap periods', 'पीरियड बदलें')}</button>` : ''}
    </div></div>
    ${V2.swapFrom ? `<div class="banner">${V2.swapFrom === 'on' ? L('Tap the first period to move.', 'पहला पीरियड चुनें।') : L(`Now tap where ${dayName(V2.swapFrom.d)} P${V2.swapFrom.p} should go. The two periods change places if no teacher clashes.`, `अब वह जगह चुनें जहाँ ${dayName(V2.swapFrom.d)} P${V2.swapFrom.p} जाए। टकराव न हो तो दोनों पीरियड जगह बदल लेंगे।`)}</div>` : ''}
    <p class="muted">${mode === 'class' ? `${L('Class teacher', 'कक्षा-शिक्षक')}: <b>${esc(nameOf(ct))}</b>` : `${L('Periods per week', 'प्रति सप्ताह पीरियड')}: <b>${weeklyLoad(UI.ttTeacher)}</b>`}
    ${manager && mode === 'class' ? ` · ${L('Tap any period to change it. Clashes are blocked.', 'बदलने के लिए किसी पीरियड पर टैप करें। टकराव रोका जाता है।')}` : ''}</p>
    <div class="table-wrap"><table class="tt">${head}${rows}</table></div>`;
}

/* ---------- DPP & worksheet requests ---------- */
function reqCard(r) {
  const u = me();
  const manager = isManager(u);
  const owner = r.teacherId === u.id;
  const title = r.kind === 'dpp' ? `${esc(r.chapter)}${r.topic ? ' — ' + esc(r.topic) : ''}` : `${esc(r.wsType)} ${L('worksheet', 'वर्कशीट')}`;
  const facts = r.kind === 'dpp'
    ? [`${r.numQ} ${L('questions', 'प्रश्न')}`, r.difficulty, r.qtypes, `${r.copies} ${L('copies', 'प्रतियाँ')}`]
    : [r.pageSize, r.color, `${r.copies} ${L('copies', 'प्रतियाँ')}`];
  let actions = '';
  if (manager) {
    if (r.status === 'requested') actions += `<button class="btn small danger-ghost" data-act="reqReject" data-id="${r.id}">${t('reject')}</button><button class="btn small ok" data-act="reqApprove" data-id="${r.id}">${t('approve')}</button>`;
    if (r.status === 'approved') actions += `<button class="btn small" data-act="reqStatus" data-id="${r.id}" data-st="in_progress">${L('Start work', 'काम शुरू')}</button>`;
    if (r.status === 'in_progress') actions += `<button class="btn small" data-act="reqStatus" data-id="${r.id}" data-st="ready">${L('Mark ready', 'तैयार')}</button>`;
    if (r.status === 'ready') actions += `<button class="btn small ok" data-act="reqStatus" data-id="${r.id}" data-st="delivered">${L('Mark delivered', 'पहुँचा दिया')}</button>`;
  }
  if (owner && r.status === 'requested') actions += `<button class="btn small ghost" data-act="reqCancel" data-id="${r.id}">${L('Withdraw', 'वापस लें')}</button>`;
  if ((manager || owner) && r.status !== 'rejected') actions += `<button class="btn small ai" data-act="aiDraft" data-id="${r.id}">📄 ${r.draft ? L('View draft', 'ड्राफ़्ट देखें') : t('aiDraft')}</button>`;
  const late = r.neededBy < todayISO() && !['delivered', 'rejected'].includes(r.status);
  return `<div class="card">
    <div class="card-top"><div><span class="kind ${r.kind}">${r.kind === 'dpp' ? 'DPP' : t('worksheet')}</span><div><strong>${esc(r.classId)} · ${esc(subjName(r.subject))}</strong><small>${title}</small></div></div>${statusChip(r.status)}</div>
    <p class="desc">${esc(r.description || '')}</p>
    <div class="facts">${facts.filter(Boolean).map(f => `<span>${esc(f)}</span>`).join('')}<span class="${late ? 'bad' : ''}">${L('Needed by', 'चाहिए')} ${fmtDate(r.neededBy)}${late ? ' · ' + L('overdue', 'देर') : ''}</span></div>
    <div class="meta">${L('By', 'द्वारा')} ${esc(nameOf(r.teacherId))}${r.assignee ? ` · ${L('Assigned to', 'ज़िम्मेदार')} ${esc(nameOf(r.assignee))}` : ''}</div>
    ${r.remark ? `<p class="remark"><b>${t('remark')}:</b> ${esc(r.remark)}</p>` : ''}
    <details class="hist"><summary>${L('History', 'इतिहास')} (${r.history.length})</summary><ul>${r.history.map(h => `<li>${fmtTime(h.at)} — ${esc(nameOf(h.by))}: ${esc(h.text)}</li>`).join('')}</ul></details>
    ${actions ? `<div class="row-end">${actions}</div>` : ''}</div>`;
}

function loginCell(s) {
  if (!s.phone) return `<span class="muted">${L('Add mobile number', 'मोबाइल नंबर जोड़ें')}</span>`;
  if (UI.codes === null) return `<span class="muted">…</span>`;
  const c = UI.codes[s.id];
  if (!c) return '—';
  const reset = `<button class="btn tiny ghost" data-act="resetPin" data-id="${s.id}">${L('New code', 'नया कोड')}</button>`;
  if (c.activated) return `<span class="ok-text">✓ ${L('Activated', 'सक्रिय')}</span> ${s.id === me().id ? '' : reset}`;
  return `<span class="code">${esc(c.code || '—')}</span> <button class="btn tiny ghost" data-act="shareCode" data-id="${s.id}">${L('Share', 'भेजें')}</button>`;
}
async function refreshCodes() {
  UI.codesLoading = true;
  const { data, error } = await SB.rpc('staff_codes');
  UI.codesLoading = false;
  if (error) { UI.codes = {}; return; }
  UI.codes = {};
  (data || []).forEach(r => (UI.codes[r.staff_id] = { code: r.code, activated: r.activated }));
  if (UI.view === 'staff' && !document.getElementById('modal-root').innerHTML) render();
}

/* ---------- reports ---------- */
function viewReports() {
  const ym = UI.reportMonth || todayISO().slice(0, 7);
  const data = teachers().map(tc => ({ id: tc.id, name: tc.name, load: weeklyLoad(tc.id), subs: monthSubs(tc.id, ym), leave: monthLeaveDays(tc.id, ym) }));
  const maxSubs = Math.max(1, ...data.map(d => d.subs));
  const maxLoad = Math.max(1, ...data.map(d => d.load));
  const subsVals = data.map(d => d.subs);
  const spread = Math.max(...subsVals) - Math.min(...subsVals);
  const req = { dpp: S.requests.filter(r => r.kind === 'dpp'), worksheet: S.requests.filter(r => r.kind === 'worksheet') };
  const sts = ['requested', 'approved', 'in_progress', 'ready', 'delivered', 'rejected'];
  return `<div class="page-head"><h2>${t('reports')}</h2><div class="btns"><input type="month" value="${ym}" data-change="reportMonth" aria-label="Month"><button class="btn primary" data-act="exportAll">⬇️ ${L('Download Excel', 'Excel डाउनलोड')}</button><button class="btn ghost" data-act="printReport">🖨️ ${L('Print / PDF', 'प्रिंट / PDF')}</button><button class="btn ghost" data-act="copyReport">📋 CSV</button></div></div>
    ${reportAttendanceHTML(ym)}
    ${salaryPanelHTML(ym)}
    <div class="cards">
      <div class="stat"><span>${L('Substitutions published', 'प्रकाशित अरेंजमेंट')}</span><b>${subsVals.reduce((a, b) => a + b, 0)}</b></div>
      <div class="stat ${spread > 3 ? 'warn' : ''}"><span>${L('Fairness gap (most − least)', 'असमानता (अधिकतम − न्यूनतम)')}</span><b>${spread}</b></div>
      <div class="stat"><span>${L('Leave days taken', 'छुट्टी के दिन')}</span><b>${data.reduce((a, b) => a + b.leave, 0)}</b></div>
    </div>
    <section class="panel"><h3>${L('Teacher workload and substitutions', 'शिक्षक कार्यभार और अरेंजमेंट')}</h3>
      <div class="table-wrap"><table class="data bars"><thead><tr><th>${t('teacher')}</th><th>${L('Periods / week', 'पीरियड / सप्ताह')}</th><th>${L('Substitutions this month', 'इस माह अरेंजमेंट')}</th><th>${L('Leave days', 'छुट्टी दिन')}</th></tr></thead>
      <tbody>${data.sort((a, b) => b.subs - a.subs || b.load - a.load).map(d => `<tr><td>${esc(d.name)}</td>
        <td><div class="bar"><i style="width:${(d.load / maxLoad) * 100}%"></i><span>${d.load}</span></div></td>
        <td><div class="bar sub"><i style="width:${(d.subs / maxSubs) * 100}%"></i><span>${d.subs}</span></div></td>
        <td>${d.leave}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted">${L('Fairness target: keep the gap between the most- and least-loaded teacher within 3 substitutions a month.', 'लक्ष्य: सबसे ज़्यादा और सबसे कम अरेंजमेंट वाले शिक्षक का अंतर महीने में 3 से कम रहे।')}</p>
    </section>
    <section class="panel"><h3>${L('DPP and worksheet requests', 'DPP और वर्कशीट अनुरोध')}</h3>
      <div class="table-wrap"><table class="data"><thead><tr><th></th>${sts.map(s => `<th>${t(s)}</th>`).join('')}<th>${L('Total', 'कुल')}</th></tr></thead>
      <tbody>${['dpp', 'worksheet'].map(k => `<tr><td><b>${k === 'dpp' ? 'DPP' : t('worksheet')}</b></td>${sts.map(s => `<td>${req[k].filter(r => r.status === s).length}</td>`).join('')}<td><b>${req[k].length}</b></td></tr>`).join('')}</tbody></table></div>
    </section>`;
}
