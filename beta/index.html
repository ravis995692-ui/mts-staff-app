/* ===== Buttons, forms, AI and start-up ===== */
function commit() { render(); queueFlush(); }

const ACTIONS = {
  go: el => go(el.dataset.view),
  toggleMenu: () => { UI.menuOpen = !UI.menuOpen; render(); },
  toggleLang: () => { S.lang = S.lang === 'en' ? 'hi' : 'en'; saveLang(); render(); },
  logout: () => confirmBox(L('Log out of the app on this phone?', 'इस फ़ोन पर ऐप से लॉग आउट करें?'), () => doLogout(), t('logout')),
  closeModal: () => closeModal(),
  closeModalBack: (el, ev) => { if (ev.target === el) closeModal(); },
  confirmYes: () => { const fn = confirmBox._fn; closeModal(); if (fn) fn(); },

  loginBack: () => { UI.loginStep = 'phone'; UI.loginError = ''; render(); },

  shiftDate: el => { UI.date = addDays(UI.date, Number(el.dataset.n)); render(); },
  dateToday: () => { UI.date = todayISO(); render(); },

  markAbsentDialog: () => openModal(t('markAbsent'), markAbsentHTML()),
  removeAbsence: el => {
    const a = S.absences.find(x => x.id === el.dataset.id);
    if (!a) return;
    confirmBox(L(`Remove absence of ${nameOf(a.teacherId)} on ${fmtDate(a.date)}? Their periods will go back to them.`, `${fmtDate(a.date)} को ${nameOf(a.teacherId)} की अनुपस्थिति हटाएँ?`),
      () => { removeAbsence(a.id, me().id); commit(); toast(L('Absence removed, plan updated', 'अनुपस्थिति हटाई, योजना अपडेट')); }, L('Remove', 'हटाएँ'));
  },
  replan: () => { generatePlan(UI.date, me().id); logAudit(me().id, `Re-planned substitutions for ${UI.date}`); commit(); toast(L('Plan refreshed', 'योजना फिर से बनी')); },
  publishPlan: () => {
    const plan = S.plans[UI.date];
    if (!plan) return;
    const unfilled = Object.values(plan.items).filter(i => !i.teacherId).length;
    const doIt = () => { publishPlan(UI.date, me().id); commit(); toast(L('Published — substitutes notified', 'प्रकाशित — शिक्षकों को सूचना भेजी गई')); };
    if (unfilled) confirmBox(L(`${unfilled} period(s) are still not covered. Publish anyway?`, `${unfilled} पीरियड अभी खाली हैं। फिर भी प्रकाशित करें?`), doIt, t('publish'));
    else doIt();
  },
  copySheet: () => copyText(sheetText(UI.date)),
  printSheet: () => {
    const w = document.getElementById('print-root');
    w.innerHTML = `<pre>${esc(sheetText(UI.date))}</pre>`;
    try { window.print(); } catch (e) { toast(L('Printing is not available here — use Copy sheet', 'यहाँ प्रिंट उपलब्ध नहीं — शीट कॉपी करें')); }
  },

  leaveForm: () => openModal(t('applyLeave'), leaveFormHTML()),
  leaveTab: el => { UI.leaveTab = el.dataset.tab; render(); },
  cancelLeave: el => {
    confirmBox(L('Withdraw this leave request?', 'यह आवेदन वापस लें?'), () => {
      S.leaves = S.leaves.filter(l => l.id !== el.dataset.id); logAudit(me().id, 'Withdrew a leave request'); commit();
    }, L('Withdraw', 'वापस लें'));
  },
  leaveDecide: el => {
    const id = el.dataset.id, ok = el.dataset.ok === '1';
    const lv = S.leaves.find(l => l.id === id);
    openModal(ok ? t('approve') : t('reject'), `<form data-form="leaveDecision" data-id="${id}" data-ok="${ok ? 1 : 0}" class="stack">
      <p><b>${esc(nameOf(lv.teacherId))}</b> · ${fmtDate(lv.from)}${lv.to !== lv.from ? ' – ' + fmtDate(lv.to) : ''} · ${esc(absenceLabel(lv))}</p>
      <p class="desc">${esc(lv.description)}</p>
      <label>${t('remark')} ${ok ? `(${L('optional', 'वैकल्पिक')})` : '*'}<textarea name="remark" rows="2" ${ok ? '' : 'required'}></textarea></label>
      ${ok ? `<p class="hint">${L('On approval the app drafts substitutes for every affected period.', 'स्वीकृति पर ऐप हर प्रभावित पीरियड के लिए अरेंजमेंट बनाएगा।')}</p>` : ''}
      <div class="row-end"><button type="button" class="btn" data-act="closeModal">${t('cancel')}</button><button class="btn ${ok ? 'ok' : 'danger'}" type="submit">${ok ? t('approve') : t('reject')}</button></div></form>`);
  },

  ackSub: el => {
    const plan = S.plans[UI.date];
    if (!plan || !plan.items[el.dataset.key]) return;
    S.acks[ackId(UI.date, el.dataset.key, me().id)] = { teacherId: me().id, date: UI.date, key: el.dataset.key, at: nowStamp() };
    logAudit(me().id, `Saw arrangement ${el.dataset.key.replace('|', ' P')} on ${UI.date}`);
    commit(); toast(L('Thank you — office informed', 'धन्यवाद — ऑफ़िस को सूचना मिल गई'));
  },

  ttMode: el => { UI.ttMode = el.dataset.mode; if (UI.ttMode === 'teacher' && !isManager(me())) UI.ttTeacher = me().id; render(); },
  editCell: el => openModal(L('Change period', 'पीरियड बदलें'), editCellHTML(Number(el.dataset.d), Number(el.dataset.p))),

  reqTab: el => { UI.reqTab = el.dataset.tab; render(); },
  newRequest: el => openModal(el.dataset.kind === 'dpp' ? t('raiseDpp') : t('raiseWs'), requestFormHTML(el.dataset.kind), { wide: true }),
  reqApprove: el => {
    const r = S.requests.find(x => x.id === el.dataset.id);
    openModal(t('approve'), `<form data-form="reqApprove" data-id="${r.id}" class="stack">
      <p><b>${r.kind === 'dpp' ? 'DPP' : t('worksheet')}</b> · ${esc(r.classId)} · ${esc(subjName(r.subject))} · ${esc(nameOf(r.teacherId))}</p>
      <label>${L('Assign to (who prepares it)', 'किसे सौंपें (कौन तैयार करेगा)')}<select name="assignee">${teacherOptions(r.teacherId)}${S.staff.filter(s => isManager(s)).map(s => `<option value="${s.id}">${esc(s.name)} (${esc(roleLabel(s.role))})</option>`).join('')}</select></label>
      <label>${t('remark')}<input name="remark" placeholder="${esc(L('e.g. Print from office by Thursday', 'जैसे गुरुवार तक ऑफ़िस से प्रिंट'))}"></label>
      <div class="row-end"><button type="button" class="btn" data-act="closeModal">${t('cancel')}</button><button class="btn ok" type="submit">${t('approve')}</button></div></form>`);
  },
  reqReject: el => {
    openModal(t('reject'), `<form data-form="reqReject" data-id="${el.dataset.id}" class="stack">
      <label>${L('Reason', 'कारण')} *<textarea name="remark" rows="2" required></textarea></label>
      <div class="row-end"><button type="button" class="btn" data-act="closeModal">${t('cancel')}</button><button class="btn danger" type="submit">${t('reject')}</button></div></form>`);
  },
  reqStatus: el => {
    const r = S.requests.find(x => x.id === el.dataset.id);
    r.status = el.dataset.st;
    r.history.push({ at: nowStamp(), by: me().id, text: `Status → ${I18N.en[r.status]}` });
    notify(r.teacherId, '', { en: `Your ${r.kind === 'dpp' ? 'DPP' : 'worksheet'} request (${r.classId} ${SUBJECTS[r.subject].en}) is now: ${I18N.en[r.status]}`, hi: `आपका ${r.kind === 'dpp' ? 'DPP' : 'वर्कशीट'} अनुरोध (${r.classId}) अब: ${I18N.hi[r.status]}` });

  },
  reqCancel: el => {
    confirmBox(L('Withdraw this request?', 'यह अनुरोध वापस लें?'), () => { S.requests = S.requests.filter(r => r.id !== el.dataset.id); logAudit(me().id, 'Withdrew a request'); commit(); }, L('Withdraw', 'वापस लें'));
  },
  aiDraft: el => openDraft(el.dataset.id),
  aiGenerate: el => generateDraft(el.dataset.id),
  copyDraft: el => { const ta = document.getElementById('draftText'); copyText(ta ? ta.value : ''); },
  saveDraft: el => {
    const r = S.requests.find(x => x.id === el.dataset.id); const ta = document.getElementById('draftText');
    if (r && ta) { r.draft = ta.value; r.history.push({ at: nowStamp(), by: me().id, text: 'Draft saved' }); toast(L('Draft saved', 'ड्राफ़्ट सहेजा')); closeModal(); commit(); }
  },

  editStaff: el => openModal(el.dataset.id ? L('Edit staff', 'स्टाफ़ बदलें') : L('Add staff', 'स्टाफ़ जोड़ें'), staffFormHTML(el.dataset.id)),
  copyReport: () => {
    const ym = UI.reportMonth || todayISO().slice(0, 7);
    const lines = ['Teacher,Periods per week,Substitutions this month,Leave days'];
    teachers().forEach(tc => lines.push(`"${tc.name}",${weeklyLoad(tc.id)},${monthSubs(tc.id, ym)},${monthLeaveDays(tc.id, ym)}`));
    copyText(lines.join('\n'));
  },

  askSuggest: el => askAssistant(el.dataset.q),
  newChat: () => newChat(),
  hideStart: () => { try { localStorage.setItem('mts-start-hidden', '1'); } catch (e) { } render(); },
  newNotice: () => openModal(L('Post notice', 'सूचना जारी करें'), `<form data-form="notice" class="stack"><label>${L('Title', 'शीर्षक')} *<input name="title" required></label><label>${L('Message', 'संदेश')} *<textarea name="body" rows="4" required></textarea></label>
    <div class="row-end"><button type="button" class="btn" data-act="closeModal">${t('cancel')}</button><button class="btn primary">${L('Post', 'जारी करें')}</button></div></form>`),
  delNotice: el => { S.notices = S.notices.filter(n => n.id !== el.dataset.id); commit(); },
  resetPin: el => {
    const s = staffById(el.dataset.id);
    confirmBox(L(`Give ${s.name} a new activation code? Their current PIN stops working and they are logged out.`, `${s.name} को नया एक्टिवेशन कोड दें? उनका मौजूदा PIN बंद हो जाएगा।`), async () => {
      const { data, error } = await SB.rpc('reset_pin', { p_staff_id: s.id });
      if (error) { toast(L('Could not reset — check internet', 'रीसेट नहीं हुआ — इंटरनेट जाँचें')); return; }
      logAudit(me().id, `Issued new activation code for ${s.name}`); queueFlush();
      await refreshCodes();
      showCode(s, data);
    }, L('New code', 'नया कोड'));
  },
  shareCode: el => { const s = staffById(el.dataset.id); const c = UI.codes && UI.codes[s.id]; if (c && c.code) showCode(s, c.code); },
  copyCodeMsg: el => copyText(el.dataset.msg),

  openNotifications: () => {
    const u = me();
    const mine = S.notifications.filter(n => n.userId === u.id).slice(0, 40);
    openModal(t('notifications'), mine.length ? `<ul class="notif">${mine.map(n => `<li class="${n.read ? '' : 'unread'}"><span>${esc(S.lang === 'hi' ? n.hi : n.en)}</span><small>${fmtTime(n.at)}</small></li>`).join('')}</ul>
      <p class="hint">${L('In the live app these also arrive as WhatsApp messages.', 'असली ऐप में ये WhatsApp पर भी आएँगी।')}</p>` : `<p class="muted">${L('No notifications.', 'कोई सूचना नहीं।')}</p>`);
    mine.forEach(n => (n.read = true));
    queueFlush();
    const b = document.querySelector('.bell b'); if (b) b.remove();
  },
};

const CHANGES = {
  setDate: el => { if (el.value) { UI.date = el.value; render(); } },
  setSub: el => { setSubstitute(UI.date, el.dataset.key, el.value || null, me().id); commit(); },
  scopeToggle: el => { const pick = el.closest('form').querySelector('.periods-pick'); if (pick) pick.classList.toggle('hidden', el.value !== 'periods'); },
  ttClass: el => { UI.ttClass = el.value; if (V2.swapFrom && V2.swapFrom !== 'on') V2.swapFrom = 'on'; render(); },
  ttTeacher: el => { UI.ttTeacher = el.value; render(); },
  reportMonth: el => { UI.reportMonth = el.value; render(); },
};

const FORMS = {
  loginPhone: async (fd) => {
    const phone = String(fd.get('phone') || '').replace(/\D/g, '').slice(-10);
    UI.loginPhone = phone; UI.loginError = '';
    if (!/^[6-9]\d{9}$/.test(phone)) { UI.loginError = L('Enter a valid 10-digit mobile number.', '10 अंकों का सही मोबाइल नंबर डालें।'); render(); return; }
    UI.loginBusy = true; render();
    try {
      await ensureBrowserSession();
      const { data, error } = await SB.rpc('staff_status', { p_phone: phone });
      if (error) throw error;
      if (data === 'ready') UI.loginStep = 'pin';
      else if (data === 'needs_activation') UI.loginStep = 'activate';
      else UI.loginError = loginErr(data);
    } catch (e) { UI.loginError = loginErr('network'); }
    UI.loginBusy = false; render();
  },
  loginPin: async (fd) => {
    UI.loginBusy = true; UI.loginError = ''; render();
    try {
      await ensureBrowserSession();
      const { data, error } = await SB.rpc('login', { p_phone: UI.loginPhone, p_pin: String(fd.get('pin')) });
      if (error) throw error;
      if (String(data).startsWith('ERR:')) { UI.loginError = loginErr(String(data).slice(4)); UI.loginBusy = false; render(); return; }
      UI.loginBusy = false;
      await enterApp(data);
      logAudit(data, 'Logged in'); queueFlush();
    } catch (e) { UI.loginBusy = false; UI.loginError = loginErr('network'); render(); }
  },
  loginActivate: async (fd) => {
    const pin = String(fd.get('pin')), pin2 = String(fd.get('pin2'));
    if (pin !== pin2) { UI.loginError = L('The two PINs do not match.', 'दोनों PIN मेल नहीं खाते।'); render(); return; }
    if (/^(\d)\1{5}$/.test(pin) || pin === '123456' || pin === '654321') { UI.loginError = L('Choose a PIN that is harder to guess.', 'ऐसा PIN चुनें जिसे अंदाज़ा लगाना मुश्किल हो।'); render(); return; }
    UI.loginBusy = true; UI.loginError = ''; render();
    try {
      await ensureBrowserSession();
      const { data, error } = await SB.rpc('activate', { p_phone: UI.loginPhone, p_code: String(fd.get('code')).trim(), p_pin: pin });
      if (error) throw error;
      if (String(data).startsWith('ERR:')) { UI.loginError = loginErr(String(data).slice(4)); UI.loginBusy = false; render(); return; }
      UI.loginBusy = false;
      await enterApp(data);
      logAudit(data, 'Activated app login'); queueFlush();
      toast(L('Welcome! Remember your PIN.', 'स्वागत है! अपना PIN याद रखें।'));
    } catch (e) { UI.loginBusy = false; UI.loginError = loginErr('network'); render(); }
  },
  leave: (fd) => {
    const u = me();
    const from = fd.get('from'), to = fd.get('to');
    if (to < from) { toast(L('"To" date is before "From" date', '"तक" तारीख़ "से" से पहले है')); return; }
    const scope = fd.get('scope');
    const periods = fd.getAll('periods').map(Number);
    if (scope === 'periods' && !periods.length) { toast(L('Choose at least one period', 'कम से कम एक पीरियड चुनें')); return; }
    const lv = { id: uid('lv'), teacherId: u.id, from, to, scope, periods, type: fd.get('type'), description: String(fd.get('description')).trim(), status: 'pending', remark: '', createdAt: nowStamp() };
    S.leaves.push(lv);
    notifyManagers({ en: `${u.name} applied for ${lv.type.toLowerCase()} leave (${fmtDate(from)}${to !== from ? ' – ' + fmtDate(to) : ''})`, hi: `${u.name} ने छुट्टी के लिए आवेदन किया (${fmtDate(from)}${to !== from ? ' – ' + fmtDate(to) : ''})` });
    logAudit(u.id, `Applied for leave ${from} to ${to}`);
    closeModal(); commit(); toast(L('Leave request sent', 'छुट्टी आवेदन भेजा गया'));
  },
  leaveDecision: (fd, form) => {
    decideLeave(form.dataset.id, form.dataset.ok === '1', String(fd.get('remark') || '').trim(), me().id);
    closeModal(); commit();
    toast(form.dataset.ok === '1' ? L('Approved — substitutes drafted', 'स्वीकृत — अरेंजमेंट तैयार') : L('Rejected — teacher informed', 'अस्वीकृत — शिक्षक को सूचना'));
  },
  absent: (fd) => {
    const tid = fd.get('tid'); const date = fd.get('date'); const scope = fd.get('scope'); const periods = fd.getAll('periods').map(Number);
    if (!tid) { toast(L('Choose a teacher', 'शिक्षक चुनें')); return; }
    if (dayIdx(date) < 0) { toast(L('That date is a Sunday', 'वह तारीख़ रविवार है')); return; }
    if (scope === 'periods' && !periods.length) { toast(L('Choose at least one period', 'कम से कम एक पीरियड चुनें')); return; }
    addAbsence(tid, date, scope, periods, String(fd.get('note') || ''), me().id);
    UI.date = date; closeModal(); UI.view = 'subs'; commit();
    toast(L('Marked absent — substitutes drafted', 'अनुपस्थित दर्ज — अरेंजमेंट तैयार'));
  },
  cell: (fd, form) => {
    const d = Number(form.dataset.d), p = Number(form.dataset.p);
    const s = fd.get('s'), tid = s ? fd.get('t') : '';
    const s2 = s ? fd.get('s2') : '', t2 = s2 ? fd.get('t2') : '', joint = !!s && fd.get('j') === 'on';
    const fail = msg => { const e = document.getElementById('cellErr'); e.textContent = msg; e.classList.remove('hidden'); };
    if (s && !tid) return fail(L('Choose a teacher.', 'शिक्षक चुनें।'));
    if (s2 && !t2) return fail(L('Choose a teacher for the second group.', 'दूसरे समूह के लिए शिक्षक चुनें।'));
    if (t2 && t2 === tid) return fail(L('Choose two different teachers.', 'दो अलग शिक्षक चुनें।'));
    for (const x of [tid, t2].filter(Boolean)) {
      const clash = CLASSES.find(c => { if (c === UI.ttClass) return false; const o = lessonAt(c, d, p); return partsOf(o).some(g => g.t === x) && !(joint && o.j); });
      if (clash) return fail(L(`${nameOf(x)} already teaches ${clash} in this period.`, `${nameOf(x)} इस पीरियड में पहले से ${clash} में हैं।`));
    }
    const oldCell = lessonAt(UI.ttClass, d, p);
    const cell = s ? { s, t: tid } : null;
    if (cell && s2) cell.x = [{ s: s2, t: t2 }];
    if (cell && joint) cell.j = true;
    if (!S.tt[UI.ttClass][d]) S.tt[UI.ttClass][d] = PERIODS.map(() => null);
    S.tt[UI.ttClass][d][p - 1] = cell;
    const say = c => (c ? `${partsOf(c).map(g => g.s).join('+')}/${cellTeachers(c)}` : 'free/-');
    const now = cell ? `${cellSubj(cell)} with ${cellTeachers(cell)}` : 'a free period';
    logAudit(me().id, `Timetable ${UI.ttClass} ${DAYS[d]} P${p}: ${say(oldCell)} → ${say(cell)}`);
    const before = partsOf(oldCell).map(g => g.t), after = partsOf(cell).map(g => g.t);
    [...new Set(before.concat(after))].filter(x => x && before.includes(x) !== after.includes(x)).forEach(x => notify(x, '', { en: `Timetable changed: ${UI.ttClass} ${DAYS[d]} P${p} is now ${now}`, hi: `समय-सारणी बदली: ${UI.ttClass} ${DAYS_HI[d]} P${p} — ${cell ? cellSubj(cell) + ', ' + cellTeachers(cell) : 'खाली पीरियड'}` }));
    // refresh any upcoming plans for this weekday
    Object.keys(S.plans).forEach(dt => { if (dt >= todayISO() && dayIdx(dt) === d) generatePlan(dt, me().id); });
    closeModal(); commit(); toast(L('Saved', 'सहेजा गया'));
  },
  request: (fd, form) => {
    const u = me();
    const kind = form.dataset.kind;
    const r = { id: uid('rq'), kind, teacherId: u.id, classId: fd.get('classId'), subject: fd.get('subject'), copies: Number(fd.get('copies') || 0),
      neededBy: fd.get('neededBy'), description: String(fd.get('description') || '').trim(), status: 'requested', assignee: '', remark: '', draft: '',
      createdAt: nowStamp(), history: [{ at: nowStamp(), by: u.id, text: 'Request raised' }] };
    if (kind === 'dpp') Object.assign(r, { chapter: String(fd.get('chapter')).trim(), topic: String(fd.get('topic') || '').trim(), numQ: Number(fd.get('numQ') || 10), difficulty: fd.get('difficulty'), qtypes: fd.get('qtypes') });
    else Object.assign(r, { wsType: fd.get('wsType'), pageSize: fd.get('pageSize'), color: fd.get('color') });
    if (kind === 'worksheet' && r.description.length < 10) { toast(L('Please describe the worksheet in a little more detail', 'कृपया वर्कशीट का थोड़ा और विवरण दें')); return; }
    S.requests.push(r);
    notifyManagers({ en: `New ${kind === 'dpp' ? 'DPP' : 'worksheet'} request from ${u.name}: ${r.classId} ${SUBJECTS[r.subject].en}`, hi: `${u.name} का नया ${kind === 'dpp' ? 'DPP' : 'वर्कशीट'} अनुरोध: ${r.classId} ${SUBJECTS[r.subject].hi}` });
    logAudit(u.id, `Raised ${kind} request for ${r.classId} ${r.subject}`);
    closeModal(); UI.view = 'requests'; commit(); toast(L('Request sent for approval', 'अनुरोध स्वीकृति हेतु भेजा गया'));
  },
  reqApprove: (fd, form) => {
    const r = S.requests.find(x => x.id === form.dataset.id);
    r.status = 'approved'; r.assignee = fd.get('assignee'); r.remark = String(fd.get('remark') || '').trim();
    r.history.push({ at: nowStamp(), by: me().id, text: `Approved, assigned to ${nameOf(r.assignee)}${r.remark ? ' — ' + r.remark : ''}` });
    notify(r.teacherId, '', { en: `Your ${r.kind === 'dpp' ? 'DPP' : 'worksheet'} request (${r.classId}) was approved`, hi: `आपका ${r.kind === 'dpp' ? 'DPP' : 'वर्कशीट'} अनुरोध (${r.classId}) स्वीकृत हुआ` });
    if (r.assignee !== r.teacherId) notify(r.assignee, '', { en: `You have been assigned a ${r.kind === 'dpp' ? 'DPP' : 'worksheet'}: ${r.classId} ${SUBJECTS[r.subject].en}, needed by ${fmtDate(r.neededBy)}`, hi: `आपको ${r.kind === 'dpp' ? 'DPP' : 'वर्कशीट'} सौंपी गई: ${r.classId}, ${fmtDate(r.neededBy)} तक` });
    logAudit(me().id, `Approved ${r.kind} request ${r.classId} ${r.subject}`);
    closeModal(); commit();
  },
  reqReject: (fd, form) => {
    const r = S.requests.find(x => x.id === form.dataset.id);
    r.status = 'rejected'; r.remark = String(fd.get('remark')).trim();
    r.history.push({ at: nowStamp(), by: me().id, text: `Rejected — ${r.remark}` });
    notify(r.teacherId, '', { en: `Your ${r.kind === 'dpp' ? 'DPP' : 'worksheet'} request (${r.classId}) was rejected: ${r.remark}`, hi: `आपका अनुरोध (${r.classId}) अस्वीकृत: ${r.remark}` });
    logAudit(me().id, `Rejected ${r.kind} request ${r.classId} ${r.subject}`);
    closeModal(); commit();
  },
  staff: (fd, form) => {
    const id = form.dataset.id;
    const phone = String(fd.get('phone') || '').replace(/\D/g, '');
    const dup = phone && S.staff.find(s => s.phone === phone && s.id !== id);
    const err = document.getElementById('staffErr');
    if (dup) { err.textContent = L(`This number already belongs to ${dup.name}.`, `यह नंबर पहले से ${dup.name} का है।`); err.classList.remove('hidden'); return; }
    const data = { name: String(fd.get('name')).trim(), phone, role: fd.get('role'), subjects: fd.getAll('subjects'), active: fd.get('active') === 'on' };
    if (id) {
      const s = staffById(id);
      if (s.id === me().id && (!data.active || !isManager(data))) { err.textContent = L('You cannot remove your own admin access.', 'आप अपनी एडमिन पहुँच नहीं हटा सकते।'); err.classList.remove('hidden'); return; }
      Object.assign(s, data); logAudit(me().id, `Updated staff ${s.name}`);
    } else {
      const s = { id: uid('t'), ...data }; S.staff.push(s); sortStaff(); logAudit(me().id, `Added staff ${s.name}`);
      closeModal(); commit();
      queueFlush().then(async () => { await refreshCodes(); const c = UI.codes && UI.codes[s.id]; if (s.phone && c && c.code) showCode(s, c.code); });
      return;
    }
    closeModal(); commit(); toast(L('Saved', 'सहेजा गया'));
  },
  settings: (fd) => {
    Object.keys(S.settings).forEach(k => { const v = Number(fd.get(k)); if (!Number.isNaN(v)) S.settings[k] = Math.max(0, Math.min(100, v)); });
    if (S.settings.dailyCap < 1) S.settings.dailyCap = 1;
    logAudit(me().id, 'Changed substitution rules');
    Object.keys(S.plans).forEach(dt => { if (dt >= todayISO() && S.plans[dt].status !== 'published') generatePlan(dt, me().id); });
    commit(); toast(L('Rules saved — draft plans updated', 'नियम सहेजे — ड्राफ़्ट योजनाएँ अपडेट'));
  },
  notice: (fd) => {
    S.notices.unshift({ id: uid('nt'), by: me().id, at: nowStamp(), title: String(fd.get('title')).trim(), body: String(fd.get('body')).trim() });
    S.staff.filter(s => s.active && s.id !== me().id).forEach(s => notify(s.id, '', { en: `New notice: ${fd.get('title')}`, hi: `नई सूचना: ${fd.get('title')}` }));
    logAudit(me().id, `Posted notice "${fd.get('title')}"`);
    closeModal(); commit();
  },
  chat: (fd, form) => { const q = String(fd.get('q') || '').trim(); if (q) askAssistant(q); },
  quickAsk: (fd) => { const q = String(fd.get('q') || '').trim(); if (!q) return; UI.view = 'assistant'; askAssistant(q); window.scrollTo(0, 0); },
};

/* ---------- DPP / worksheet drafting ---------- */
function openDraft(id) {
  const r = S.requests.find(x => x.id === id);
  openModal(L('Draft', 'ड्राफ़्ट') + ` — ${r.kind === 'dpp' ? 'DPP' : t('worksheet')} ${r.classId} ${subjName(r.subject)}`, `
    <p class="hint">${L('Makes a ready-to-fill sheet in MTS format from the request. Type the questions in, then save or copy for printing.', 'अनुरोध से MTS प्रारूप में भरने योग्य शीट बनती है। प्रश्न लिखें, फिर प्रिंट के लिए सहेजें या कॉपी करें।')}</p>
    <textarea id="draftText" class="draft" rows="16">${esc(r.draft || '')}</textarea>
    <div class="row-end"><button class="btn ai" data-act="aiGenerate" data-id="${r.id}" id="genBtn">📄 ${r.draft ? L('Start again from template', 'टेम्पलेट से फिर शुरू') : t('aiDraft')}</button>
      <button class="btn ghost" data-act="copyDraft">📋 ${L('Copy', 'कॉपी')}</button><button class="btn primary" data-act="saveDraft" data-id="${r.id}">${t('save')}</button></div>`, { wide: true });
}
function templateDraft(r) {
  const top = `${SCHOOL.name}, ${SCHOOL.place}\n${r.kind === 'dpp' ? 'DAILY PRACTICE PROBLEMS (DPP)' : (r.wsType || '').toUpperCase() + ' WORKSHEET'}\nClass: ${r.classId}    Subject: ${SUBJECTS[r.subject].en}    Date: ________\nName: ______________________    Roll No: ______\n`;
  if (r.kind === 'dpp') {
    let s = `${top}Chapter: ${r.chapter}${r.topic ? '  |  Topic: ' + r.topic : ''}\nDifficulty: ${r.difficulty}   |   Types: ${r.qtypes}\n\n`;

async function doCheck(kind) {
  if (V2.checkBusy) return;
  if (!navigator.onLine) { V2.checkMsg = { kind: 'bad', text: checkErr('offline') }; render(); return; }
  V2.checkBusy = true; V2.checkMsg = { kind: 'busy', text: L('Marking…', 'दर्ज हो रहा है…') }; render();
  const meta = { tz: new Date().getTimezoneOffset(), ua: (navigator.userAgent || '').slice(0, 160), standalone: matchMedia('(display-mode: standalone)').matches };
  try {
    const { data, error } = await SB.rpc('check_in', { p_kind: kind, p_device: deviceId(), p_meta: meta });
    if (error) throw error;
    V2.checkBusy = false;
    if (data && data.ok) {
      const rec = data.record;
      const i = S.attendance.findIndex(a => a.id === rec.id);
      if (i >= 0) S.attendance[i] = rec; else S.attendance.unshift(rec);
      LAST.attendance = LAST.attendance || new Map(); LAST.attendance.set(rec.id, JSON.stringify(rec));
      V2.checkMsg = { kind: 'ok', text: kind === 'in' ? L(`Checked in at ${fmtClock(rec.in.at)} — ${attLabel(rec.status)}.`, `${fmtClock(rec.in.at)} बजे चेक-इन — ${attLabel(rec.status)}।`)
        : L(`Checked out at ${fmtClock(rec.out.at)}.`, `${fmtClock(rec.out.at)} बजे चेक-आउट।`) };
      logAudit(me().id, `Checked ${kind}`);
      queueFlush();
    } else V2.checkMsg = { kind: 'bad', text: checkErr((data && data.error) || 'unknown') };
  } catch (e) {
    V2.checkBusy = false;
    const missing = /check_in|function|does not exist|schema cache/i.test((e && e.message) || '');
    V2.checkMsg = { kind: 'bad', text: checkErr(missing ? 'setup' : 'offline') };
  }
  render();
}

function monthStats(tid, ym) {
  const [y, m] = ym.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const out = { present: 0, late: 0, absent: 0, leave: 0, review: 0, days: 0 };
  for (let d = 1; d <= last; d++) {
    const iso = `${ym}-${pad(d)}`;
    if (iso > todayISO() || dayIdx(iso) < 0) continue;
    const st = attStatus(tid, iso);
    if (st === 'not_in' || st === 'untracked') continue;
    out.days++;
    if (st === 'rejected') out.absent++; else if (out[st] != null) out[st]++;
  }
  return out;
}

async function ensureMonthLoaded(ym) {
  V2.loadedMonths = V2.loadedMonths || {};
  if (V2.loadedMonths[ym] || ym >= addDays(todayISO(), -70).slice(0, 7)) return;
  V2.loadedMonths[ym] = 'loading';
  try {
    const { data } = await SB.from('attendance').select('id,data').gte('data->>date', ym + '-01').lte('data->>date', ym + '-31').limit(5000);
    (data || []).forEach(r => { if (!S.attendance.some(a => a.id === r.id)) { S.attendance.push(r.data); (LAST.attendance = LAST.attendance || new Map()).set(r.id, JSON.stringify(r.data)); } });
  } catch (e) { }
  V2.loadedMonths[ym] = true; render();
}

/* =================================================================
   2. LEAVE: balances and calendar

const leaveUnits = l => { const days = workDaysBetween(l.from, l.to).length; return l.scope === 'full' ? days : days * 0.5; };
function leaveYear(iso = todayISO()) {
  const ys = Number(leavePolicy().yearStart) || 4;
  const [y, m] = iso.split('-').map(Number);
  const startY = m >= ys ? y : y - 1;
  return { from: `${startY}-${pad(ys)}-01`, to: addDays(`${startY + 1}-${pad(ys)}-01`, -1), label: `${startY}–${String(startY + 1).slice(2)}` };
}
function leaveBalance(tid) {
  const pol = leavePolicy(), yr = leaveYear();
  return LEAVE_TYPES.filter(tp => Number(pol[tp]) > 0).map(tp => {
    const used = S.leaves.filter(l => l.teacherId === tid && l.type === tp && l.status === 'approved' && l.from >= yr.from && l.from <= yr.to).reduce((a, l) => a + leaveUnits(l), 0);
    const pending = S.leaves.filter(l => l.teacherId === tid && l.type === tp && l.status === 'pending' && l.from >= yr.from && l.from <= yr.to).reduce((a, l) => a + leaveUnits(l), 0);
    return { type: tp, allowed: Number(pol[tp]), used, pending, left: Number(pol[tp]) - used };
  });
}
function balanceHTML(tid, compact) {
  const b = leaveBalance(tid);
  if (!b.length) return '';
  return `<div class="balances ${compact ? 'compact' : ''}">${b.map(x => `<div class="bal ${x.left <= 0 ? 'none' : x.left <= 2 ? 'low' : ''}"><span>${esc(leaveTypeName(x.type))}</span><b>${x.left}</b><small>${L('of', 'में से')} ${x.allowed}${x.pending ? ` · ${x.pending} ${L('pending', 'लंबित')}` : ''}</small><i style="width:${Math.max(0, Math.min(100, (x.used / Math.max(1, x.allowed)) * 100))}%"></i></div>`).join('')}</div>`;
}
const leaveTypeName = tp => ({ Casual: L('Casual', 'आकस्मिक'), Sick: L('Sick', 'बीमारी'), Personal: L('Personal', 'निजी'), 'Official duty': L('Official duty', 'सरकारी/विद्यालय कार्य'), Emergency: L('Emergency', 'आपातकालीन') }[tp] || tp);

    <div class="cal">${(S.lang === 'hi' ? ['सोम', 'मंगल', 'बुध', 'गुरु', 'शुक्र', 'शनि', 'रवि'] : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']).map(d => `<div class="cal-h">${d}</div>`).join('')}${cells.join('')}</div>

const syId = (cls, subj) => `sy_${cls.replace(/\s+/g, '_')}_${subj}`;
const syRow = (cls, subj) => S.syllabus.find(x => x.id === syId(cls, subj)) || null;
const syPct = r => (r && r.chapters.length ? Math.round((r.chapters.filter(c => c.done).length / r.chapters.length) * 100) : 0);
/* class + subject pairs a teacher teaches (from the timetable) */
function myPairs(tid) {
  const out = new Map();
  CLASSES.forEach(c => (S.tt[c] || []).forEach(day => day.forEach(l => partsOf(l).forEach(g => { if (g.t === tid) out.set(`${c}|${g.s}`, { cls: c, subject: g.s }); }))));
  return [...out.values()].sort((a, b) => CLASSES.indexOf(a.cls) - CLASSES.indexOf(b.cls) || a.subject.localeCompare(b.subject));
}
function allPairs() {
  const out = new Map();
  CLASSES.forEach(c => (S.tt[c] || []).forEach(day => day.forEach(l => partsOf(l).forEach(g => { const k = `${c}|${g.s}`; if (!out.has(k)) out.set(k, { cls: c, subject: g.s, teachers: new Set() }); out.get(k).teachers.add(g.t); }))));
  return [...out.values()];
}

function syUpsert(cls, subj, fn) {
  let r = syRow(cls, subj);
  if (!r) {
    const p = allPairs().find(x => x.cls === cls && x.subject === subj);
    const tid = p && p.teachers.has(me().id) ? me().id : p ? [...p.teachers][0] : me().id;
    r = { id: syId(cls, subj), teacherId: tid, cls, subject: subj, chapters: [], updatedAt: nowStamp() };
    S.syllabus.push(r);
  }
  fn(r); r.updatedAt = nowStamp();
}

/* =================================================================
   4. EXAM DUTIES (invigilation chart)
   ================================================================= */
const examById = id => S.exams.find(e => e.id === id);
const dutyKey = (date, sess, room) => `${date}|${sess}|${room}`;
function myDuties(tid, date) {
  const out = [];
  S.exams.filter(e => e.published).forEach(e => Object.entries(e.duties || {}).forEach(([k, ids]) => {
    if (!ids.includes(tid)) return;
    const [d, sess, room] = k.split('|');
    if (date && d !== date) return;
    const se = (e.sessions || []).find(s => s.id === sess) || { label: sess, time: '' };
    out.push({ exam: e.name, date: d, session: se.label, time: se.time, room });
  }));
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
}
function autoAssign(e) {
  const load = {}; teachers().forEach(tc => { load[tc.id] = 0; });
  S.exams.filter(x => x.id !== e.id).forEach(x => Object.values(x.duties || {}).forEach(ids => ids.forEach(id => { if (load[id] != null) load[id] += 0.5; })));
  e.duties = {};
  (e.days || []).forEach(date => (e.sessions || []).forEach(se => {
    const busy = new Set();
    const avail = () => teachers().filter(tc => !busy.has(tc.id) && !S.absences.some(a => a.teacherId === tc.id && a.date === date && a.scope === 'full') && !S.leaves.some(l => l.teacherId === tc.id && l.status === 'approved' && l.from <= date && l.to >= date));
    (e.rooms || []).forEach(room => {
      const pick = [];
      for (let i = 0; i < (Number(e.perRoom) || 1); i++) {
        const list = avail().filter(tc => !pick.includes(tc.id)).sort((a, b) => load[a.id] - load[b.id] || ((a.id + date + room).length % 3) - ((b.id + date + room).length % 3) || a.name.localeCompare(b.name));
        // do not put a class's own class-teacher in that room
        const best = list.find(tc => S.classTeachers[room] !== tc.id) || list[0];
        if (!best) break;
        pick.push(best.id); busy.add(best.id); load[best.id]++;
      }
      e.duties[dutyKey(date, se.id, room)] = pick;
    });
  }));
}

function reminderTick() {
  const u = me(); if (!u || isManager(u)) return;
  const date = todayISO(); const d = dayIdx(date); if (d < 0) return;
  const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes();
  const plan = S.plans[date];
  const subs = plan && plan.status === 'published' ? Object.values(plan.items).filter(i => i.teacherId === u.id) : [];
  PERIODS.forEach(p => {

/* voice: speak a question, hear the answer (Chrome on Android supports Hindi and English) */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function startVoice() {
  if (!SpeechRec) { toast(L('Voice input is not supported in this browser. Use Chrome.', 'इस ब्राउज़र में आवाज़ से पूछना उपलब्ध नहीं। Chrome उपयोग करें।')); return; }
  if (V2.listening) { try { V2.rec && V2.rec.stop(); } catch (e) { } return; }
  const rec = new SpeechRec(); V2.rec = rec;
  rec.lang = S.lang === 'hi' ? 'hi-IN' : 'en-IN'; rec.interimResults = true; rec.maxAlternatives = 1;
  const input = document.querySelector('.chat-in input, .quickask input');
  rec.onresult = ev => { const txt = Array.from(ev.results).map(r => r[0].transcript).join(' '); if (input) input.value = txt; if (ev.results[ev.results.length - 1].isFinal && txt.trim()) { V2.voiceAsked = true; rec.stop(); if (UI.view !== 'assistant') { go('assistant'); } askAssistant(txt.trim()); } };
  rec.onend = () => { V2.listening = false; const b = document.querySelector('.mic'); if (b) b.classList.remove('on'); };
  rec.onerror = ev => { V2.listening = false; if (ev.error === 'not-allowed') toast(L('Microphone permission refused', 'माइक्रोफ़ोन की अनुमति नहीं मिली')); };
  V2.listening = true; const b = document.querySelector('.mic'); if (b) b.classList.add('on');
  try { rec.start(); } catch (e) { V2.listening = false; }
}
function speak(text) {
  if (!V2.voiceOn || !('speechSynthesis' in window)) return;
  const plain = String(text).replace(/\|[-|: ]+\|/g, ' ').replace(/[*#|_`>]/g, ' ').replace(/\s+/g, ' ').slice(0, 600);
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(plain); u.lang = S.lang === 'hi' ? 'hi-IN' : 'en-IN'; u.rate = 1; speechSynthesis.speak(u); } catch (e) { }
}

/* =================================================================
   9. TIMETABLE: swap two periods
   ================================================================= */
function swapCheck(cls, a, b) {
  // a, b: {d, p}. After swapping, every teacher of A must be free at B (outside this class) and vice versa.
  const la = lessonAt(cls, a.d, a.p), lb = lessonAt(cls, b.d, b.p);
  const busyElsewhere = (tid, d, p) => CLASSES.find(c => c !== cls && partsOf(lessonAt(c, d, p)).some(g => g.t === tid));
  for (const g of partsOf(la)) { const c = busyElsewhere(g.t, b.d, b.p); if (c && !(la.j && (lessonAt(c, b.d, b.p) || {}).j)) return L(`${nameOf(g.t)} is busy in ${c} at ${dayName(b.d)} P${b.p}.`, `${nameOf(g.t)} ${dayName(b.d)} P${b.p} में ${c} में व्यस्त हैं।`); }
  for (const g of partsOf(lb)) { const c = busyElsewhere(g.t, a.d, a.p); if (c && !(lb.j && (lessonAt(c, a.d, a.p) || {}).j)) return L(`${nameOf(g.t)} is busy in ${c} at ${dayName(a.d)} P${a.p}.`, `${nameOf(g.t)} ${dayName(a.d)} P${a.p} में ${c} में व्यस्त हैं।`); }
  return null;
}

const DEFAULT_SALARY_RULES = { lateCount: 3, lateCut: 0.5, pendingAs: 'present' };
const salaryRules = () => ({ ...DEFAULT_SALARY_RULES, ...((S.config && S.config.salaryRules) || {}) });
/* For one person: every approved leave day in the leave year, in date order, marked paid or unpaid
   (paid while the yearly allowance for that type lasts; 0 allowance = not limited; Official duty is always paid). */
function leaveDayMap(tid, ym) {
  const pol = leavePolicy(); const yr = leaveYear(ym + '-01');
  const used = {}; const map = {};
  S.leaves.filter(l => l.teacherId === tid && l.status === 'approved' && l.to >= yr.from && l.from <= yr.to)
    .sort((a, b) => a.from.localeCompare(b.from))
    .forEach(l => workDaysBetween(l.from < yr.from ? yr.from : l.from, l.to).forEach(d => {
      const unit = l.scope === 'full' ? 1 : 0.5;
      const allow = Number(pol[l.type]) || 0;
      used[l.type] = (used[l.type] || 0) + unit;
      const unlimited = l.type === 'Official duty' || allow <= 0;
      const over = unlimited ? 0 : Math.min(unit, Math.max(0, used[l.type] - allow));
      const prev = map[d] || { paid: 0, unpaid: 0, types: [] };
      map[d] = { paid: prev.paid + unit - over, unpaid: prev.unpaid + over, types: prev.types.concat(l.type), duty: prev.duty || l.type === 'Official duty' };
    }));
  return map;
}
/* one row of numbers for one person and month (counts up to today for the current month) */
function salaryRow(p, ym) {
  const rules = salaryRules();
  const [y, m] = ym.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const lm = leaveDayMap(p.id, ym);
  const r = { daysInMonth, sundays: 0, working: 0, counted: 0, present: 0, late: 0, duty: 0, paidLeave: 0, unpaidLeave: 0, absent: 0, pending: 0, before: 0, notes: [] };
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${ym}-${pad(d)}`;
    if (dayIdx(iso) < 0) { r.sundays++; continue; }
    r.working++;
    if (iso > todayISO()) continue;
    r.counted++;
    const st = attStatus(p.id, iso);
    const lv = lm[iso];
    if (st === 'untracked') { r.before++; continue; }
    if (st === 'present' || st === 'late') {
      if (st === 'late') r.late++; else r.present++;
      if (lv) { r.paidLeave += lv.paid; r.unpaidLeave += lv.unpaid; } // half-day leave on a day they also came
      continue;
    }
    if (st === 'review') { r.pending++; if (rules.pendingAs === 'present') r.present++; else r.absent++; continue; }
    if (st === 'leave') {
      if (lv) { if (lv.duty) r.duty += lv.paid; else r.paidLeave += lv.paid; r.unpaidLeave += lv.unpaid; if (lv.paid + lv.unpaid < 1) r.absent += 1 - (lv.paid + lv.unpaid); }
      else r.absent++; // marked absent by the office without a leave application
      continue;
    }
    if (st === 'absent' || st === 'rejected') { r.absent++; continue; }
    if (st === 'not_in') { r.counted--; continue; } // today, before closing time
  }
  r.lateCut = rules.lateCount > 0 ? Math.floor(r.late / rules.lateCount) * rules.lateCut : 0;
  r.lwp = r.absent + r.unpaidLeave + r.lateCut;
  r.payableFull = Math.max(0, daysInMonth - r.lwp);
  if (r.pending) r.notes.push(L(`${r.pending} check-in(s) waiting for approval`, `${r.pending} चेक-इन स्वीकृति बाकी`));
  if (r.before) r.notes.push(L(`${r.before} day(s) before attendance started, counted as present`, `${r.before} दिन हाज़िरी शुरू होने से पहले, उपस्थित गिने`));
  if (r.unpaidLeave) r.notes.push(L('leave beyond the yearly allowance', 'वार्षिक सीमा से अधिक छुट्टी'));
  return r;
}

function resolveDate(s) {
  if (!s) return todayISO();
  const v = String(s).trim().toLowerCase();
  if (/^(today|aaj|आज)$/.test(v)) return todayISO();
  if (/^(tomorrow|kal|कल)$/.test(v)) return addDays(todayISO(), 1);
  if (/^yesterday$/.test(v)) return addDays(todayISO(), -1);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  let m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);

/* ---------- tiny, safe markdown for answers ---------- */
function md(src) {
  const lines = esc(src).split('\n');
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let html = '', i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i + 1])) {
      const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      html += '<div class="md-table"><table><thead><tr>' + cells(ln).map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { html += '<tr>' + cells(lines[i]).map(c => `<td>${c}</td>`).join('') + '</tr>'; i++; }
      html += '</tbody></table></div>'; continue;
    }
    if (/^\s*[-*•]\s+/.test(ln)) {
      html += '<ul>'; while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) { html += `<li>${inline(lines[i].replace(/^\s*[-*•]\s+/, ''))}</li>`; i++; } html += '</ul>'; continue;
    }
    if (/^\s*\d+[.)]\s+/.test(ln)) {
      html += '<ol>'; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { html += `<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/, ''))}</li>`; i++; } html += '</ol>'; continue;
    }
    if (/^#{1,4}\s+/.test(ln)) { html += `<p><b>${inline(ln.replace(/^#{1,4}\s+/, ''))}</b></p>`; i++; continue; }
    if (!ln.trim()) { i++; continue; }
    html += `<p>${inline(ln)}</p>`; i++;
  }
  return html;
}

/* ===== Timetable Builder (Admin / Coordinator) ===== */
const BLD = { cls: null, scope: 'all', preview: null, pcls: null, busy: false, seed: 1 };
const SLOTS = () => DAYS.length * PERIODS.length;

/* What a class should have each week: { SUBJ: { n: periods, t: teacherId } }.
   Until someone edits it, it is read from the current timetable. */
function curriculumOf(cls) {
  if (S.curriculum[cls]) return S.curriculum[cls];
  const out = {}, votes = {};
  (S.tt[cls] || []).forEach(day => day.forEach(l => {
    if (!l) return;
    out[l.s] = out[l.s] || { n: 0, t: l.t };
    out[l.s].n++;
    votes[l.s] = votes[l.s] || {};
    votes[l.s][l.t] = (votes[l.s][l.t] || 0) + 1;
  }));
  Object.keys(out).forEach(s => { out[s].t = Object.entries(votes[s]).sort((a, b) => b[1] - a[1])[0][0]; });
  return out;
}
function editCurriculum(cls) {
  if (!S.curriculum[cls]) S.curriculum[cls] = JSON.parse(JSON.stringify(curriculumOf(cls)));
  return S.curriculum[cls];
}
const currTotal = cls => Object.values(curriculumOf(cls)).reduce((a, x) => a + (Number(x.n) || 0), 0);
function plannedLoad() {
  const load = {};
  CLASSES.forEach(c => Object.values(curriculumOf(c)).forEach(x => { if (x.t && x.n) load[x.t] = (load[x.t] || 0) + Number(x.n); }));
  return load;
}

/* Problems that make a timetable impossible, before we try to build it */
function curriculumProblems(classes) {
  const out = [];
  classes.forEach(c => {
    const cur = curriculumOf(c), tot = currTotal(c);
    if (tot > SLOTS()) out.push(L(`${c}: ${tot} periods planned, but a week has only ${SLOTS()}.`, `${c}: ${tot} पीरियड तय हैं, पर सप्ताह में केवल ${SLOTS()} हैं।`));
    if (tot === 0) out.push(L(`${c}: no subjects added yet.`, `${c}: अभी कोई विषय नहीं जोड़ा।`));
    Object.entries(cur).forEach(([s, x]) => {
      if (!x.n) return;
      if (!x.t || !staffById(x.t) || !staffById(x.t).active) out.push(L(`${c}: choose a teacher for ${subjName(s)}.`, `${c}: ${subjName(s)} के लिए शिक्षक चुनें।`));
      if (x.n > DAYS.length * 2) out.push(L(`${c}: ${subjName(s)} has ${x.n} periods; the most possible is ${DAYS.length * 2} (2 a day).`, `${c}: ${subjName(s)} के ${x.n} पीरियड; अधिकतम ${DAYS.length * 2} (दिन में 2) संभव हैं।`));
    });
  });
  Object.entries(plannedLoad()).forEach(([tid, n]) => {
    if (n > SLOTS()) out.push(L(`${nameOf(tid)} has ${n} periods planned — more than the ${SLOTS()} in a week.`, `${nameOf(tid)} के ${n} पीरियड तय हैं — सप्ताह के ${SLOTS()} से ज़्यादा।`));
  });
  return out;
}

/* Build a clash-free timetable for `targets`; all other classes stay as they are. */
function buildTimetable(targets, seed) {
  const ND = DAYS.length, NP = PERIODS.length, NS = ND * NP;
  let best = null;
  for (let attempt = 0; attempt < 12; attempt++) {
    const rnd = mulberry32(seed * 104729 + attempt * 7919);
    const rows = {};
    CLASSES.forEach(c => {
      if (!targets.includes(c)) { rows[c] = []; for (let d = 0; d < ND; d++) for (let p = 1; p <= NP; p++) rows[c].push(lessonAt(c, d, p)); return; }
      const list = [];
      Object.entries(curriculumOf(c)).forEach(([s, x]) => { for (let i = 0; i < x.n; i++) list.push({ s, t: x.t }); });
      while (list.length < NS) list.push(null);
      for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
      rows[c] = list;
    });
    const hard = (c, i) => {
      const cell = rows[c][i]; if (!cell) return 0;
      let cost = 0;
      for (const o of CLASSES) if (o !== c && partsOf(rows[o][i]).some(g => g.t === cell.t)) cost++;
      const d0 = Math.floor(i / NP) * NP; let same = 0;
      for (let k = d0; k < d0 + NP; k++) if (rows[c][k] && rows[c][k].s === cell.s) same++;
      if (same > 2) cost += same - 2;
      return cost;
    };
    const total = () => { let n = 0; targets.forEach(c => { for (let i = 0; i < NS; i++) n += hard(c, i); }); return n; };
    let cost = total();
    for (let step = 0; step < 70000 && cost > 0; step++) {
      const c = targets[Math.floor(rnd() * targets.length)], i = Math.floor(rnd() * NS);
      if (hard(c, i) === 0 && rnd() > 0.02) continue;
      let pick = -1, bestDelta = Infinity;
      for (let k = 0; k < 20; k++) {
        const j = Math.floor(rnd() * NS);
        if (j === i) continue;
        const a = rows[c][i], b = rows[c][j];
        if ((a && b && a.s === b.s) || (!a && !b)) continue;
        const before = hard(c, i) + hard(c, j);
        rows[c][i] = b; rows[c][j] = a;
        const after = hard(c, i) + hard(c, j);
        rows[c][i] = a; rows[c][j] = b;
        const delta = after - before + (rnd() - 0.5) * 0.2;
        if (delta < bestDelta) { bestDelta = delta; pick = j; }
      }
      if (pick >= 0 && bestDelta <= 0.1) [rows[c][i], rows[c][pick]] = [rows[c][pick], rows[c][i]];
      if (step % 500 === 0) cost = total();
    }
    cost = total();
    if (cost === 0) {
      // tidy up without breaking anything: free periods to the end of the day, same subject not twice a day
      const soft = c => {
        let n = 0;
        for (let d = 0; d < ND; d++) {
          let seenFree = false; const cnt = {};
          for (let p = 0; p < NP; p++) {
            const x = rows[c][d * NP + p];
            if (!x) seenFree = true; else { if (seenFree) n += 3; cnt[x.s] = (cnt[x.s] || 0) + 1; }
          }
          Object.values(cnt).forEach(v => { if (v > 1) n += 1; });
        }
        return n;
      };
      for (let step = 0; step < 25000; step++) {
        const c = targets[Math.floor(rnd() * targets.length)], i = Math.floor(rnd() * NS), j = Math.floor(rnd() * NS);
        if (i === j) continue;
        const before = soft(c);
        if (before === 0) continue;
        [rows[c][i], rows[c][j]] = [rows[c][j], rows[c][i]];
        if (hard(c, i) + hard(c, j) > 0 || soft(c) > before) [rows[c][i], rows[c][j]] = [rows[c][j], rows[c][i]];
      }
    }
    if (!best || cost < best.cost) {
      const tt = {};
      targets.forEach(c => { tt[c] = []; for (let d = 0; d < ND; d++) tt[c].push(rows[c].slice(d * NP, d * NP + NP).map(x => (x ? { s: x.s, t: x.t } : null))); });
      best = { tt, cost };
    }
    if (cost === 0) break;
  }
  return { tt: best.tt, ok: best.cost === 0, cost: best.cost, classes: targets.slice() };
}

/* Problems in the timetable that is live right now */
function timetableIssues() {
  const clashes = [], empty = {};
  for (let d = 0; d < DAYS.length; d++) for (let p = 1; p <= PERIODS.length; p++) {
    const seen = {};
    CLASSES.forEach(c => {
      const l = lessonAt(c, d, p);
      if (!l) { empty[c] = (empty[c] || 0) + 1; return; }
      partsOf(l).forEach(g => {
        if (!g.t) return;
        const first = seen[g.t];
        if (!first) seen[g.t] = { c, j: !!l.j };
        else if (!(l.j && first.j)) clashes.push({ day: d, p, teacher: g.t, classes: [first.c, c] });
      });
    });
  }
  const inactive = [];
  CLASSES.forEach(c => (S.tt[c] || []).forEach(day => day.forEach(l => partsOf(l).forEach(g => { if ((!staffById(g.t) || !staffById(g.t).active) && !inactive.includes(`${c}|${g.t}`)) inactive.push(`${c}|${g.t}`); }))));
  return { clashes, empty, inactive };
}

function brainAnswer(q) {
  const lower = q.toLowerCase().replace(/[?!।,]/g, ' ').replace(/\s+/g, ' ').trim();
  const u = me(), mgr = isManager(u);
  const has = re => re.test(lower);
  // entities
  let { person, ambiguous } = entPerson(lower);
  const selfRef = has(/\b(my|me|mine|mera|meri|mere|main|mujhe|apna|apni|apne|i)\b|मेरा|मेरी|मेरे|मैं|मुझे|अपना|अपनी/);
  const pron = has(/\b(his|her|their|he|she|unka|unki|unke|uska|uski|inka|inki|woh|wo|vo|unhone|them|same teacher)\b|उनका|उनकी|उसका|उसकी|वह|वो/);
  let { cls, grade } = entClass(q);
  let subject = entSubject(lower);
  let { period, now } = entPeriod(lower);
  let range = entRange(lower);
  const hadEntity = !!(person || cls || grade || subject || period || range);
  if (!person && selfRef) person = u;
  if (!person && pron && BR.ctx.person) person = staffById(BR.ctx.person);
  if (ambiguous && !person) return { text: L(`Which one do you mean? ${ambiguous.map(s => `**${s.name}**`).join(', ')}`, `आप किसकी बात कर रहे हैं? ${ambiguous.map(s => `**${s.name}**`).join(', ')}`), chips: ambiguous.map(s => q.replace(/[?]/g, '') + ' — ' + s.name).slice(0, 3) };

  const week = has(/\bweek\b|weekly|\bhafte\b|\bsaptah\b|pura hafta|whole week|full timetable|सप्ताह|हफ्त/);

  /* intent table: first match wins */
  const intents = [
    ['greet', () => has(/^(hi|hello|hey|namaste|namaskar|good (morning|afternoon|evening)|नमस्ते|नमस्कार)\b/) && lower.split(' ').length <= 3],
    ['thanks', () => has(/^(thanks|thank you|thankyou|shukriya|dhanyavad|dhanyawad|ok thanks|great|nice|धन्यवाद|शुक्रिया)\b/)],
    ['help', () => has(/\bhelp\b|what can you|kya kar sakte|kya puch|how to use|madad|मदद|क्या पूछ|examples?\b/)],
    ['timing', () => has(/\b(timing|timings|what time|kitne baje|kab (shuru|khatam)|when does|start time|end time|bell)\b|बजे|समय क्या/) && has(/period|lunch|school|break|chhutti|पीरियड|स्कूल|लंच|ghanti|घंटी|[1-8]/)],
    ['whatif', () => has(/\b(if|agar|yadi|suppose|what if)\b|अगर|यदि/) && has(/absent|leave|chutti|chhutti|nahi aa|na aa|not come|doesn.?t come|छुट्टी|अनुपस्थित|न आ|नहीं आ/)],
    ['summary', () => has(/summary|briefing|\bbrief\b|overview|daily report|status report|saransh|sar[a]?ansh|aaj ka haal|kya chal raha|what.?s happening|how is today|सारांश|हाल/)],
    ['ttcheck', () => has(/clash|conflict|takrav|takraav|टकराव|double.?book/) || (has(/\bcheck\b|jaanch|जाँच|verify|problem|issue|galti/) && has(/time ?table|samay|समय-सारणी|schedule/))],
    ['free', () => has(/\bfree\b|khali|khaali|खाली|फ्री|available|uplabdh|vacant/)],
    ['subs', () => has(/substitut|arrangement|arrangment|proxy|\bcover(ed|age|s|ing)?\b|uncovered|अरेंजमेंट|प्रॉक्सी|adjustment/)],
    ['workload', () => has(/workload|work load|busiest|lightest|most periods|least periods|sabse (zyada|jyada|kam) period|periods? per week|kitne period|how many periods|karyabhar|कार्यभार|कितने पीरियड/)],
    ['absent', () => has(/absent|anupasthit|अनुपस्थित|not present|gair ?hazir|nahi aa(ye|ya|yi)|नहीं आ|on leave|chh?utti par|छुट्टी पर|who is (out|away)|present/) && !has(/pending|approve|reject|apply|applied|status|lambit|लंबित/)],
    ['leave', () => has(/\bleaves?\b|chh?utti|छुट्टी|avkash|अवकाश|holiday request/)],
    ['requests', () => has(/\bdpps?\b|work ?sheets?|वर्कशीट|requests?\b|anurodh|अनुरोध|overdue|practice problem/)],
    ['classteacher', () => has(/class ?teacher|kaksha.?(shikshak|adhyapak)|कक्षा-शिक्षक|कक्षा शिक्षक/)],
    ['whoteaches', () => has(/who (teaches|takes|is teaching)|kaun padha|kon padha|teaches|padhata|padhati|padhate|teacher (of|for)|ka teacher|ke teacher|कौन पढ़ा|पढ़ाता|पढ़ाती|पढ़ाते|what does .* teach|kya padha/)],
    ['contact', () => has(/phone|mobile|contact|number|नंबर|मोबाइल/) && !!person],
    ['stafflist', () => has(/how many (teachers|staff)|kitne (teacher|shikshak|staff)|list (of )?(all )?(teachers|staff)|all teachers|staff list|sabhi (teacher|shikshak)|teachers? list|कितने शिक्षक|सभी शिक्षक|inactive|who are the|teachers of|shikshak/)],
    ['notices', () => has(/notice|suchna|सूचना|announcement|circular/) && !has(/notification/)],
    ['notifs', () => has(/notification|alerts?\b/)],
    ['audit', () => has(/audit|change log|who changed|kisne (badla|kiya)|history of changes|बदलाव|किसने/)],
    ['counts', () => has(/how many (classes|sections|periods|subjects)|kitni (kaksha|class)|kitne (section|vishay)|total classes|कितनी कक्षा/)],
    ['where', () => !!person && has(/where|kahan|kaha|kidhar|कहाँ|कहां|which class|kis class|kaun si class|किस कक्षा/)],
    ['classnow', () => !!cls && (now || !!period) && !person],
    ['schedule', () => !!person && has(/schedule|time ?table|periods?|classes|routine|\bday\b|\bdin\b|duty|duties|शेड्यूल|समय-सारणी|पीरियड|busy/)],
    ['classtt', () => !!(cls || grade) && has(/time ?table|schedule|routine|periods|समय-सारणी|टाइमटेबल/)],
    ['persononly', () => !!person && !selfRef],
    ['classonly', () => !!(cls || grade)],
    ['subjectinfo', () => !!subject],
    ['periodonly', () => !!period],
    ['dateonly', () => !!range],
    ['selfonly', () => !!person],
  ];
  let intent = (intents.find(([, test]) => test()) || [])[0];
  const bare = ['persononly', 'classonly', 'subjectinfo', 'periodonly', 'dateonly', 'selfonly'].includes(intent);
  // follow-up: "and tomorrow?", "what about 9A?" — reuse the previous kind of question
  const followUp = has(/^(and|aur|what about|how about|or|ya|same for|then|phir|और)\b/) || lower.split(' ').length <= 3;
  if (BR.lastIntent && hadEntity && followUp && bare) {
    const c = BR.ctx, li = BR.lastIntent;
    const newPerson = !!entPerson(lower).person, newClass = !!(cls || grade);
    const fits = (range && ['schedule', 'where', 'free', 'classtt', 'classnow', 'subs', 'absent', 'leave', 'requests', 'summary', 'whatif', 'workload'].includes(li))
      || (newPerson && ['schedule', 'where', 'free', 'subs', 'absent', 'leave', 'requests', 'whatif', 'workload', 'contact', 'whoteaches'].includes(li))
      || (newClass && ['classtt', 'classnow', 'whoteaches', 'classteacher', 'requests', 'subs'].includes(li))
      || (subject && ['whoteaches', 'free', 'requests', 'stafflist'].includes(li))
      || (period && ['free', 'where', 'classnow', 'schedule'].includes(li));
    if (fits) {
      intent = li;
      if (!person && c.person && !newClass) person = staffById(c.person);
      if (!newClass && c.cls && !newPerson) cls = c.cls;
      if (!subject && c.subject && ['whoteaches', 'free'].includes(li)) subject = c.subject;
      if (!period && c.period && !range && ['free', 'where', 'classnow'].includes(li)) period = c.period;
      if (!range && c.range && ['schedule', 'where', 'free', 'classtt', 'classnow', 'absent', 'whatif'].includes(li)) range = c.range;
    }
  }
  intent = { persononly: 'schedule', selfonly: 'schedule', classonly: 'classtt', periodonly: 'free' }[intent] || intent;
  const Rr = range || one(todayISO()), RMr = range || thisMonth();
  const out = runIntent(intent, { q, lower, has, u, mgr, person, cls, grade, subject, period, now, range, R: Rr, RM: RMr, week, selfRef });
  if (intent && !['greet', 'thanks', 'help'].includes(intent)) {
    BR.lastIntent = intent;
    BR.ctx = { person: person ? person.id : BR.ctx.person, cls: cls || BR.ctx.cls, subject: subject || BR.ctx.subject, period: period || null, range: range || null };
  }
  return out;
}

function runIntent(intent, e) {
  const { has, u, mgr, person, cls, grade, subject, period, range, R, RM, week } = e;
  const today = todayISO();
  const noData = (en, hi) => ({ text: L(en, hi) });
  switch (intent) {
    case 'greet': return { text: L(`Namaste ${u.name.split(' ')[0]}! Ask me anything about the school's timetable, absences, substitutions, leave or requests.`, `नमस्ते ${u.name.split(' ')[0]}! समय-सारणी, अनुपस्थिति, अरेंजमेंट, छुट्टी या अनुरोध के बारे में कुछ भी पूछें।`), chips: [L("Today's summary", 'आज का सारांश'), L('What can you do?', 'आप क्या कर सकते हैं?')] };
    case 'thanks': return { text: L('Happy to help.', 'खुशी हुई।') };
    case 'help': return { text: helpText() };
    case 'timing': {
      if (period) return { text: L(`**P${period}** runs **${periodTime(period)}**.`, `**P${period}** का समय **${periodTime(period)}** है।`) };
      const rows = PERIODS.map(p => [`P${p.n}`, periodTime(p.n)]); rows.splice(LUNCH.after, 0, [t('lunch'), `${LUNCH.start}–${LUNCH.end}`]);
      return { text: `${L('School day', 'स्कूल का दिन')} (${DAYS[0]}–${DAYS[DAYS.length - 1]})\n\n` + tbl([t('period'), L('Time', 'समय')], rows) };
    }
    case 'summary': return { text: briefing(R.from), chips: mgr ? [L('Who is free now?', 'अभी कौन खाली है?'), L('Pending leave', 'लंबित छुट्टी'), L('Overdue requests', 'देर से चल रहे अनुरोध')] : [L('My schedule today', 'आज मेरा शेड्यूल'), L('My leave', 'मेरी छुट्टी')] };
    case 'ttcheck': {
      const iss = timetableIssues(), lines = [];
      if (!iss.clashes.length) lines.push(L('✅ **No clashes** — no teacher is in two classes at the same time.', '✅ **कोई टकराव नहीं** — कोई शिक्षक एक साथ दो कक्षाओं में नहीं है।'));
      else lines.push(L(`⚠️ **${iss.clashes.length} clash(es)** found:`, `⚠️ **${iss.clashes.length} टकराव** मिले:`) + '\n\n' + tbl([L('Day', 'दिन'), t('period'), t('teacher'), L('Classes', 'कक्षाएँ')], iss.clashes.slice(0, 30).map(c => [dayName(c.day), `P${c.p}`, nameOf(c.teacher), c.classes.join(' + ')])));
      const emp = Object.entries(iss.empty);
      if (emp.length) lines.push(L('Empty periods per week: ', 'प्रति सप्ताह खाली पीरियड: ') + emp.map(([c, n]) => `${c}: ${n}`).join(', '));
      if (iss.inactive.length) lines.push(L('⚠️ Periods given to removed or inactive staff: ', '⚠️ हटाए गए/निष्क्रिय स्टाफ़ को दिए पीरियड: ') + iss.inactive.map(x => x.split('|')[0] + ' (' + nameOf(x.split('|')[1]) + ')').join(', '));
      const over = teachers().filter(tc => weeklyLoad(tc.id) > 40);
      if (over.length) lines.push(L('Teachers with more than 40 periods a week: ', '40 से ज़्यादा पीरियड वाले शिक्षक: ') + over.map(tc => `${tc.name} (${weeklyLoad(tc.id)})`).join(', '));
      return { text: lines.join('\n\n') };
    }
    case 'whatif': {
      if (!mgr) return { text: L('Only the Admin or Coordinator can plan substitutions. You can see your own substitution periods on My Day.', 'अरेंजमेंट की योजना केवल एडमिन या कोऑर्डिनेटर बना सकते हैं। अपने अरेंजमेंट पीरियड आप “मेरा दिन” पर देख सकते हैं।') };
      if (!person || person.role !== 'teacher') return noData('Tell me which teacher, e.g. "If Rohit Sir is absent tomorrow, who will cover?"', 'बताएँ कौन-से शिक्षक, जैसे "अगर कल Rohit Sir न आएँ तो कौन पढ़ाएगा?"');
      let dt = range ? range.from : (dayIdx(today) < 0 ? addDays(today, 1) : today);
      if (dt < today && has(/\bkal\b|कल/)) dt = addDays(today, 1);
      const scope = has(/first half|pehli pali|morning|subah|पहली पाली/) ? 'first' : has(/second half|doosri pali|dusri pali|after lunch|afternoon|दूसरी पाली/) ? 'second' : 'full';
      const res = tool('preview_substitution', { teacher: person.id, date: dt, scope });
      if (res.note) return { text: L(`${fmtDate(dt)} is a Sunday — no school.`, `${fmtDate(dt)} रविवार है।`) };
      if (!res.periodsToCover.length) return { text: L(`**${person.name}** has no classes in that time on ${fmtDate(dt)}, so nothing needs cover.`, `${fmtDate(dt)} को उस समय **${person.name}** की कोई कक्षा नहीं, इसलिए अरेंजमेंट नहीं चाहिए।`) };
      const rows = res.periodsToCover.map(g => [`P${g.period}`, g.class, g.subject, g.suggestions[0] ? `**${g.suggestions[0].teacher}** (${g.suggestions[0].score})` : L('nobody free', 'कोई खाली नहीं'), g.suggestions.slice(1).map(s => s.teacher).join(', ') || '—']);
      return { text: L(`If **${person.name}** is absent on **${fmtDate(dt)}**${scope !== 'full' ? ` (${scope} half)` : ''}, **${rows.length}** period(s) need cover. This is only a preview — nothing was changed.`, `अगर **${person.name}** **${fmtDate(dt)}** को न आएँ, तो **${rows.length}** पीरियड भरने होंगे। यह केवल अनुमान है — कुछ बदला नहीं गया।`) + '\n\n' + tbl([t('period'), t('class'), t('subject'), L('Best substitute', 'सबसे उपयुक्त'), L('Other options', 'अन्य विकल्प')], rows) + '\n\n' + L('To do it for real, use **Mark absent** on the Substitutions screen.', 'असल में करने के लिए अरेंजमेंट स्क्रीन पर **अनुपस्थित दर्ज करें** दबाएँ।') };
    }
    case 'free': {
      const dt = R.from, d = dayIdx(dt);
      if (d < 0) return { text: L(`${fmtDate(dt)} is a Sunday — no school.`, `${fmtDate(dt)} रविवार है — स्कूल बंद।`) };
      if (e.now && !period) return { text: L(`No period is running right now (${nowHM()}).`, `अभी (${nowHM()}) कोई पीरियड नहीं चल रहा।`), chips: [L('Who is free in period 5?', 'पीरियड 5 में कौन खाली है?')] };
      if (person && person.role === 'teacher' && !(e.selfRef && has(/who|kaun|कौन/))) {
        if (period) { const du = dutyAt(person.id, dt, period); return { text: du.k === 'free' ? L(`✅ Yes — **${person.name}** is free in **P${period}** on ${fmtDate(dt)}.`, `✅ हाँ — **${person.name}** ${fmtDate(dt)} को **P${period}** में खाली हैं।`) : L(`❌ No — in **P${period}** on ${fmtDate(dt)}, **${person.name}** has: ${du.text}.`, `❌ नहीं — ${fmtDate(dt)} को **P${period}** में **${person.name}**: ${du.text}।`) }; }
        const fp = PERIODS.filter(pp => dutyAt(person.id, dt, pp.n).k === 'free').map(pp => `P${pp.n} (${periodTime(pp.n)})`);
        return { text: fp.length ? L(`**${person.name}** is free on ${fmtDate(dt)} in: ${fp.join(', ')}.`, `**${person.name}** ${fmtDate(dt)} को इन पीरियड में खाली हैं: ${fp.join(', ')}।`) : L(`**${person.name}** has no free period on ${fmtDate(dt)}.`, `${fmtDate(dt)} को **${person.name}** का कोई पीरियड खाली नहीं।`) };
      }
      const res = tool('free_teachers', { date: dt, period: period || undefined });
      const filt = names => (subject ? names.filter(n => { const s = findPerson(n); return s && s.subjects.includes(subject); }) : names);
      if (period) { const names = filt(res.periods[0].free); return { text: names.length ? L(`Free in **P${period}** (${periodTime(period)}) on ${fmtDate(dt)}${subject ? `, ${subjName(subject)} teachers` : ''} — **${names.length}**:\n\n`, `${fmtDate(dt)} को **P${period}** (${periodTime(period)}) में खाली — **${names.length}**:\n\n`) + names.map(n => `- ${n}`).join('\n') : L(`No ${subject ? subjName(subject) + ' teacher' : 'teacher'} is free in P${period} on ${fmtDate(dt)}.`, `${fmtDate(dt)} को P${period} में कोई ${subject ? subjName(subject) + ' ' : ''}शिक्षक खाली नहीं।`) }; }
      return { text: `${L('Free teachers on', 'खाली शिक्षक —')} ${fmtDate(dt)}\n\n` + tbl([t('period'), L('Free', 'खाली')], res.periods.map(x => [`P${x.period}`, filt(x.free).join(', ') || '—'])) };
    }
    case 'subs': {
      const rank = has(/most|highest|maximum|sabse (zyada|jyada|adhik)|top|least|lowest|sabse kam|fair|barabar|ranking|सबसे|count|kitne|how many/);
      if (rank && !(person && has(/how many|kitne|count/))) {
        const res = tool('workload_and_fairness', { from: RM.from, to: RM.to }).teachers;
        const least = has(/least|lowest|sabse kam|सबसे कम/);
        const list = res.slice().sort((a, b) => (least ? a.substitutionsTaken - b.substitutionsTaken : b.substitutionsTaken - a.substitutionsTaken));
        const tot = res.reduce((a, x) => a + x.substitutionsTaken, 0);
        if (!tot) return { text: L(`No published substitutions in ${rlabel(RM)}.`, `${rlabel(RM)} में कोई प्रकाशित अरेंजमेंट नहीं।`) };
        const gap = Math.max(...res.map(x => x.substitutionsTaken)) - Math.min(...res.map(x => x.substitutionsTaken));
        return { text: L(`Substitutions taken, ${rlabel(RM)} — **${tot}** in total, gap between most and least: **${gap}**${gap > 3 ? ' ⚠️ (target is 3 or less)' : ''}`, `अरेंजमेंट, ${rlabel(RM)} — कुल **${tot}**, सबसे ज़्यादा और सबसे कम का अंतर: **${gap}**`) + '\n\n' + tbl([t('teacher'), L('Substitutions', 'अरेंजमेंट'), L('Periods/week', 'पीरियड/सप्ताह')], list.slice(0, 12).map(x => [x.teacher, x.substitutionsTaken, x.periodsPerWeek])) };
      }
      const P = person && person.role === 'teacher' ? person : null;
      const rr = range || (P ? thisMonth() : one(today));
      let rows = tool('substitutions', { from: rr.from, to: rr.to, teacher: P ? P.id : undefined, class: cls || undefined });

    }
    case 'schedule': {
      if (person.role !== 'teacher') return { text: mgr && e.selfRef ? briefing(R.from) : L(`${person.name} is ${roleLabel(person.role)} and has no teaching periods.`, `${person.name} ${roleLabel(person.role)} हैं; उनके पढ़ाने के पीरियड नहीं हैं।`) };
      if (period && !week) { const du = dutyAt(person.id, R.from, period); return { text: L(`**${person.name}**, ${fmtDate(R.from)} **P${period}** (${periodTime(period)}): **${du.text}**.`, `**${person.name}**, ${fmtDate(R.from)} **P${period}**: **${du.text}**।`) }; }
      const f = person.name.split(' ')[0];
      return { text: scheduleAnswer(person, R, week && !(range && range.from === range.to)), chips: [L(`${f}'s whole week`, `${f} का पूरा सप्ताह`), L(`When is ${f} free today?`, `${f} आज कब खाली हैं?`)] };
    }
    case 'classtt': {
      if (!cls && grade) return { text: grade.map(c => classAnswer(c, range, week || !range)).join('\n\n') };
      if (subject) { const rows = tool('who_teaches', { class: cls, subject }); if (rows.length) return { text: L(`In **${cls}**, ${rows[0].subject} is taught by **${rows.map(r => r.teacher).join(', ')}** (${rows.reduce((a, r) => a + r.periodsPerWeek, 0)} periods a week).`, `**${cls}** में ${subjName(subject)} **${rows.map(r => r.teacher).join(', ')}** पढ़ाते हैं।`) }; }
      const single = range && range.from === range.to;
      return { text: classAnswer(cls, single ? range : null, !single), chips: single ? [L(`${cls} whole week`, `${cls} पूरा सप्ताह`)] : [L(`${cls} timetable today`, `${cls} आज का टाइमटेबल`), L(`Class teacher of ${cls}`, `${cls} के कक्षा-शिक्षक`)] };
    }
    case 'subjectinfo': {
      const list = teachers().filter(s => s.subjects.includes(subject));
      const rows = tool('who_teaches', { subject });
      return { text: L(`**${subjName(subject)}** — ${list.length} teacher(s): ${list.map(s => s.name).join(', ') || '—'}`, `**${subjName(subject)}** — ${list.length} शिक्षक: ${list.map(s => s.name).join(', ') || '—'}`) + (rows.length ? '\n\n' + tbl([t('class'), t('teacher'), L('Periods/week', 'पीरियड/सप्ताह')], rows.sort((a, b) => CLASSES.indexOf(a.class) - CLASSES.indexOf(b.class)).map(x => [x.class, x.teacher, x.periodsPerWeek])) : '') };
    }
    case 'dateonly': return { text: briefing(R.from) };
  }
  return { text: L("I didn't understand that. I can answer questions about the school's data — here are some examples.", 'मैं यह नहीं समझ सका। मैं स्कूल के डेटा से जुड़े प्रश्नों के उत्तर दे सकता हूँ — कुछ उदाहरण:') + '\n\n' + helpText().split('\n').slice(2).join('\n') };
}

/* ---------- chat plumbing ---------- */
function askAssistant(q) {
  UI.chat.push({ role: 'user', text: q });
  let out;
  try { out = brainAnswer(q); } catch (err) { out = { text: L('Sorry, I could not work that out. Please ask in a different way.', 'क्षमा करें, यह नहीं निकाल सका। कृपया दूसरे तरीके से पूछें।') }; }
  UI.chat.push({ role: 'assistant', text: out.text, chips: out.chips || [] });
  speak(out.text);
  if (UI.chat.length > 60) UI.chat = UI.chat.slice(-60);
  render();
  const i = document.querySelector('.chat-in input'); if (i && window.innerWidth > 860) i.focus();
}
function newChat() { UI.chat = []; BR.ctx = {}; BR.lastIntent = null; render(); }
function generateDraft(id) {
  const r = S.requests.find(x => x.id === id);
  document.getElementById('draftText').value = templateDraft(r);
  toast(L('Template added — type the questions in', 'टेम्पलेट जोड़ा — प्रश्न लिखें'));
}

function viewAssistant() {
  const mgr = isManager(me());
  const groups = mgr ? [
    [L('Today', 'आज'), [L("Today's summary", 'आज का सारांश'), L('Who is absent today?', 'आज कौन अनुपस्थित है?'), L('Substitutions today', 'आज के अरेंजमेंट'), L('Who is free now?', 'अभी कौन खाली है?')]],
    [L('Staff', 'स्टाफ़'), [L('Who has the most periods?', 'सबसे ज़्यादा पीरियड किसके हैं?'), L('Most substitutions this month', 'इस महीने सबसे ज़्यादा अरेंजमेंट'), L('Pending leave', 'लंबित छुट्टी'), L('Who took the most leave this month?', 'इस महीने सबसे ज़्यादा छुट्टी किसने ली?')]],
    [L('Planning', 'योजना'), [L(`If ${(teachers()[0] || { name: 'a teacher' }).name} is absent tomorrow who will cover?`, `अगर कल ${(teachers()[0] || { name: '' }).name} न आएँ तो कौन पढ़ाएगा?`), L('Check timetable for clashes', 'टाइमटेबल में टकराव जाँचो'), L('Overdue requests', 'देर से चल रहे अनुरोध'), L(`${CLASSES[0]} timetable tomorrow`, `${CLASSES[0]} का कल का टाइमटेबल`)]],
  ] : [
    [L('My day', 'मेरा दिन'), [L('My schedule today', 'आज मेरा शेड्यूल'), L('My schedule tomorrow', 'कल मेरा शेड्यूल'), L('When am I free today?', 'आज मैं कब खाली हूँ?'), L('My substitutions this month', 'इस महीने मेरे अरेंजमेंट')]],
    [L('My requests', 'मेरे अनुरोध'), [L('My leave', 'मेरी छुट्टी'), L('My DPP and worksheet requests', 'मेरे DPP और वर्कशीट अनुरोध'), L('Notices', 'सूचनाएँ')]],
    [L('School', 'स्कूल'), [L('Who is free in period 5?', 'पीरियड 5 में कौन खाली है?'), L(`${CLASSES[0]} timetable today`, `${CLASSES[0]} का आज का टाइमटेबल`), L('Period timings', 'पीरियड का समय')]],
  ];
  const last = UI.chat[UI.chat.length - 1];
  return `<div class="page-head"><h2>${t('assistant')}</h2><div class="btns"><span class="chip st-approved">⚡ ${L('Instant answers from school data', 'स्कूल डेटा से तुरंत उत्तर')}</span><button class="btn small ${V2.voiceOn ? 'primary' : 'ghost'}" data-act="voiceToggle">🔊 ${V2.voiceOn ? L('Speaking answers', 'उत्तर बोल रहा है') : L('Speak answers', 'उत्तर बोलें')}</button>${UI.chat.length ? `<button class="btn small ghost" data-act="newChat">${L('Clear', 'साफ़ करें')}</button>` : ''}</div></div>
    <section class="panel chat">
      <div class="chat-log">${UI.chat.length ? UI.chat.map(m => m.role === 'assistant'
        ? `<div class="msg assistant"><span class="ai-badge">⚡</span><div class="md">${md(m.text)}</div></div>`
        : `<div class="msg user"><div>${esc(m.text)}</div></div>`).join('') + (last && last.chips && last.chips.length ? `<div class="suggest follow">${last.chips.map(s => `<button class="chip-btn" data-act="askSuggest" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : '')
        : `<div class="empty small">${L('Ask in English, Hindi or Hinglish — or tap a question below.', 'अंग्रेज़ी, हिंदी या Hinglish में पूछें — या नीचे कोई प्रश्न चुनें।')}</div>
           ${groups.map(([name, qs]) => `<div class="qgroup"><b>${esc(name)}</b><div class="suggest">${qs.map(s => `<button class="chip-btn" data-act="askSuggest" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`).join('')}`}</div>
      <form data-form="chat" class="chat-in"><input name="q" placeholder="${esc(L('e.g. who is free in period 5 tomorrow?', 'जैसे: कल पीरियड 5 में कौन खाली है?'))}" autocomplete="off"><button type="button" class="icon-btn mic ${V2.listening ? 'on' : ''}" data-act="voice" aria-label="${esc(L('Ask by voice', 'बोलकर पूछें'))}">🎤</button><button class="btn primary">${t('ask')}</button></form>
      <p class="hint">${L('Answers come straight from the school data you are allowed to see. Nothing is sent to any outside AI service, and the assistant never changes anything.', 'उत्तर सीधे उसी स्कूल डेटा से आते हैं जो आप देख सकते हैं। कुछ भी किसी बाहरी AI सेवा को नहीं भेजा जाता, और सहायक कुछ नहीं बदलता।')} <a href="#" data-act="askSuggest" data-q="help">${L('What can I ask?', 'क्या पूछ सकते हैं?')}</a></p>
    </section>`;
}

boot();

</script>
